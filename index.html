<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Ping Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 롤토체스풍 판타지 아레나: 깊은 청록 어둠 위의 헥스테크 금색, 코스트 색 카드, 탁구대 보드 */
:root{
  --void:#060c10;--arena:#0b171c;--panel:#0f1f25;--panel-2:#152a31;--panel-3:#1b3540;
  --line:rgba(200,170,110,.22);--line-strong:rgba(200,170,110,.55);
  --gold:#c8aa6e;--gold-hi:#f0d79a;--gold-ink:#1d1405;--parch:#f0e6d2;
  --ink:#e9f0f1;--muted:#93a9ae;--ally:#3ba7ff;--foe:#ff4d5a;--ice:#8fe3ff;
  --c1:#a3acb5;--c2:#17b98a;--c3:#3389e6;--c4:#c24de2;--c5:#f5b335;--c6:#ff5470;
  --display:'Cinzel',serif;--body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --chamfer:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 var(--body);letter-spacing:-.01em;-webkit-user-select:none;user-select:none;
  background:linear-gradient(180deg,#0e1f25 0%,var(--void) 55%)}
::selection{background:var(--gold);color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:lining-nums tabular-nums;letter-spacing:0}

main{max-width:920px;margin:0 auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px}
.brand{font:800 17px/1 var(--display);color:var(--gold-hi);letter-spacing:.02em;white-space:nowrap;margin:0}
#stage{margin:0 auto;display:flex;white-space:nowrap;align-items:center;gap:6px;padding:5px 16px;color:var(--parch);font:700 13px/1 var(--body);
  background:linear-gradient(#1d3640,#10222a);border:1px solid var(--line-strong);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
#stage .num{color:var(--gold-hi);font-size:16px}
#account{color:var(--muted);font-size:12px;margin-top:-4px}

.wrap{position:relative}
canvas.board{display:block;width:100%;aspect-ratio:1/1;max-height:58vh;touch-action:manipulation;
  border:1px solid var(--line-strong);border-radius:14px;background:#0a171c;
  box-shadow:0 18px 40px -18px #000c,inset 0 0 0 1px #0008}
@media (min-width:760px){canvas.board{aspect-ratio:16/9;max-height:64vh}}
.caption{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-weight:700;font-size:13px;color:var(--parch);text-shadow:0 2px 6px #000;pointer-events:none}

/* 시너지: 왼쪽 내 팀, 오른쪽 상대 팀 */
.traits{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.right{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.traits.foe{position:static;align-items:flex-end}
.tr{--tc:#888;--fr:#3b4a50;display:flex;align-items:center;gap:6px;padding:2px 9px 2px 2px;min-width:0;
  background:linear-gradient(90deg,#071015ee,#07101599);border-radius:4px 10px 10px 4px;color:var(--muted);font-size:11px;line-height:1.2}
.traits.foe .tr{flex-direction:row-reverse;padding:2px 2px 2px 9px;border-radius:10px 4px 4px 10px;background:linear-gradient(270deg,#071015ee,#07101599)}
.tr .emb{position:relative;width:24px;height:26px;flex:none;display:grid;place-items:center;background:var(--fr);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tr .emb::after{content:"";width:18px;height:20px;background:#1b262b;clip-path:inherit}
.tr .emb i{position:absolute;inset:7px;border-radius:50%;background:#4b5961;z-index:1}
.tr .tn{font-weight:700;white-space:nowrap}
.tr .bp{display:flex;gap:3px;font:700 10px/1 var(--display);color:#6d7f85}
.tr .bp em{font-style:normal}.tr .bp em.hit{color:var(--parch)}
.tr .cnt{font:800 12px/1 var(--display);color:var(--ink)}
.tr.on{color:var(--parch)}
.tr.on .emb{--fr:#b0743a}.tr.on .emb i{background:var(--tc)}
.tr.max .emb{--fr:var(--gold-hi)}
.tr.max{box-shadow:inset 0 0 0 1px #f0d79a55}
.trtxt{display:flex;flex-direction:column;gap:1px}
.traits.foe .trtxt{align-items:flex-end}

#players{display:flex;flex-direction:column;gap:4px}
.pl{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 8px;min-width:118px;padding:4px 9px;border-radius:8px;
  background:#071015dd;font-size:11px;color:var(--parch);border:1px solid transparent}
.pl.me{border-color:#3ba7ff55}.pl.foe{border-color:#ff4d5a44}
.pl .bar{grid-column:1/-1;height:5px;background:#000a;border-radius:3px;overflow:hidden}
.pl .bar i{display:block;height:100%;background:linear-gradient(90deg,#1f86e0,var(--ally))}
.pl.foe .bar i{background:linear-gradient(90deg,#c22536,var(--foe))}
.pl .num{justify-self:end;font-size:13px}

/* 설명 패널 (롤토체스 툴팁처럼 코스트 색 머리) */
#info{position:relative;min-height:60px;padding:10px 12px 10px 14px;color:var(--muted);font-size:13.5px;line-height:1.55;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px}
#info strong{color:var(--parch);font-size:15px}
#info .meta{color:var(--gold);font-size:12px;margin-left:6px}
#info .ult{display:block;margin-top:4px}
#info .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#info .chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 5px;border-radius:999px;background:#0008;color:var(--parch);font-size:11.5px}
#info .chip i{width:9px;height:9px;border-radius:50%;background:var(--tc)}

/* 상점 바 */
#shopbar{display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line-strong);border-radius:14px;
  background:linear-gradient(180deg,#132a32 0%,#0b1a20 100%);box-shadow:0 14px 30px -16px #000d}
.bar2{display:flex;align-items:center;gap:8px}
.gold{display:flex;align-items:center;gap:6px;color:var(--gold-hi)}
.gold .num{font-size:22px}
.coin{width:20px;height:20px}
#trophy{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
#trophy .num{color:var(--parch);font-size:14px}
.actions{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:6px;margin-left:auto}
button{white-space:nowrap;font:600 13px/1 var(--body);color:var(--parch);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 12px;background:linear-gradient(180deg,#1c3a45,#122a32);border:1px solid var(--line);border-radius:10px;
  transition:background-color .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){border-color:var(--line-strong);background:linear-gradient(180deg,#234754,#163440)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.38;cursor:default}
button .cost{display:inline-flex;align-items:center;gap:2px;color:var(--gold-hi);font:800 12px/1 var(--display)}
button.go{min-height:44px;padding:0 18px;color:var(--gold-ink);font-weight:800;font-size:14px;border:0;border-radius:0;clip-path:var(--chamfer);
  background:linear-gradient(180deg,#f6dea3,#c8aa6e 55%,#a3824a)}
button.go:hover:not(:disabled){background:linear-gradient(180deg,#fff0c4,#d9bb7c 55%,#b08f55)}
@media (max-width:520px){
  .brand{font-size:14px}#stage{padding:5px 12px;font-size:12px}
  .bar2{flex-wrap:wrap}.actions{width:100%;grid-template-columns:repeat(3,1fr) 1.3fr;margin-left:0}
  .actions button{flex-direction:column;gap:3px;min-height:54px;padding:6px 4px;font-size:12px;white-space:nowrap}
  .actions button.go{font-size:13px}
  .tr .bp{display:none}.tr{padding:2px 8px 2px 2px}.tr .emb{width:20px;height:22px}.tr .emb::after{width:15px;height:17px}.tr .emb i{inset:6px}
  .pl{min-width:104px}
}

.shoprow{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;margin:0 -10px;scroll-snap-type:x proximity;scroll-padding:0 14px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--gold) transparent;cursor:grab;
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.shoprow.grabbing{cursor:grabbing;scroll-snap-type:none}
.sc{scroll-snap-align:start}
@media (prefers-reduced-motion:no-preference){.shoprow{scroll-behavior:smooth}.shoprow.grabbing{scroll-behavior:auto}}
.shoprow::-webkit-scrollbar{height:6px}.shoprow::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.sc{--tc:var(--c1);position:relative;flex:0 0 auto;width:86px;aspect-ratio:3/4;cursor:pointer;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#1a2f37 0%,#0c181d 100%);box-shadow:inset 0 0 0 2px var(--tc),0 8px 16px -10px #000;transition:transform .15s,box-shadow .15s}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,color-mix(in srgb,var(--tc) 35%,transparent),transparent 70%)}
.sc img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.sc .plate{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;gap:3px;padding:14px 6px 5px;
  background:linear-gradient(transparent,#05090bf0 40%);font-size:11px;font-weight:700;color:var(--parch);white-space:nowrap}
.sc .plate span:first-child{overflow:hidden;text-overflow:ellipsis}
.sc .cost{display:inline-flex;align-items:center;gap:2px;color:var(--gold-hi);font:800 12px/1 var(--display)}
.sc .cost .coin{width:12px;height:12px}
.sc .cb{position:absolute;right:4px;top:4px;display:inline-flex;align-items:baseline;gap:1px;padding:2px 5px;border-radius:5px;background:var(--tc);color:#08100f;font:900 13px/1 var(--display)}
.sc .cb small{font:800 9px/1 var(--body)}
.price{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:12px}
.sc{touch-action:pan-x}
.sc.ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;opacity:.92;box-shadow:inset 0 0 0 2px var(--gold-hi),0 18px 30px -10px #000;transition:none}
.sc.dragging{opacity:.35}
.sc .st{position:absolute;left:4px;top:4px;display:flex;gap:2px;font:800 10px/1 var(--display)}
.sc .st b{padding:3px 4px;border-radius:4px;color:#fff;background:#b45309}.sc .st b+b{background:#b91c1c}
.sc .tt{position:absolute;right:4px;top:24px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;z-index:1}
.sc .tt i{display:flex;align-items:center;gap:3px;padding:1px 5px 1px 3px;border-radius:4px;background:#05090bd9;color:#c9d4d6;font:700 9.5px/1.3 var(--body);font-style:normal}
.sc .tt i::before{content:"";width:7px;height:8px;background:var(--tc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sc .tt i.has{background:var(--tc);color:#08100f}.sc .tt i.has::before{background:#08100f}
/* 보드에 같은 캐릭터가 있으면: 테두리를 도는 빛 + 모서리 반짝임 (합성 가능 표시) */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
.sc.bonus{box-shadow:inset 0 0 0 2px #b9a4ff,0 0 0 2px #6d5dfc,0 10px 18px -8px #000}
.sc.bonus::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;z-index:2;background:linear-gradient(115deg,transparent 30%,#d9ccff55 45%,#9ef0ff44 52%,transparent 66%);background-size:250% 100%;background-position:100% 0}
.sc .bonus-tag{position:absolute;left:0;right:0;top:44%;z-index:3;padding:2px 0;text-align:center;font:800 9.5px/1.3 var(--body);color:#fff;background:linear-gradient(90deg,#5b47e0,#2fb8d8);letter-spacing:.02em}
@media (prefers-reduced-motion:no-preference){
  .sc.bonus{animation:bonusPulse 1.6s ease-in-out infinite}
  .sc.bonus::after{animation:sheen 2.2s ease-in-out infinite}
}
@keyframes bonusPulse{0%,100%{box-shadow:inset 0 0 0 2px #b9a4ff,0 0 0 2px #6d5dfc,0 10px 18px -8px #000}50%{box-shadow:inset 0 0 0 2px #e2d9ff,0 0 0 3px #22c7e8,0 10px 18px -8px #000}}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:-40% 0}}
.sc.owned{box-shadow:inset 0 0 0 2px var(--gold-hi),0 8px 16px -10px #000}
.sc .spark{position:absolute;inset:0;border-radius:10px;padding:2.5px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--spin),transparent 0 62%,#fff8dc 74%,var(--gold-hi) 80%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.sc .spark::after{content:"";position:absolute;left:6px;bottom:26px;width:14px;height:14px;background:#fff8dc;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@media (prefers-reduced-motion:no-preference){
  .sc .spark{animation:spin 1.8s linear infinite}
  .sc .spark::after{animation:twinkle 1.4s ease-in-out infinite}
}
@keyframes spin{to{--spin:360deg}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.sc .emo{position:relative;display:grid;place-items:center;height:72%;filter:drop-shadow(0 5px 6px #000a)}
.food-ico{display:inline-block;vertical-align:-3px;flex:none}
.sc:hover{transform:translateY(-2px)}
.sc.sel{transform:translateY(-4px);box-shadow:inset 0 0 0 2px var(--gold-hi),0 0 0 2px var(--gold),0 10px 18px -8px #000}
.sc.frozen::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 3px var(--ice);
  background:linear-gradient(180deg,#bfefff55,transparent 45%)}
.sep{flex:0 0 1px;margin:6px 2px;background:var(--line)}

#bctl{display:flex;gap:8px;justify-content:center}
#lobby{max-width:720px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:14px}
#account{color:var(--muted);font-size:12px;margin-top:-6px}
.play{display:flex;flex-direction:column;gap:10px;padding:18px 14px;border:1px solid var(--line-strong);border-radius:14px;background:linear-gradient(180deg,#132a32,#0b1a20)}
button.wide{width:100%;min-height:58px;font-size:18px}
.hint{margin:4px 0 2px;color:var(--muted);font-size:12.5px;text-align:center}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.dgrid{grid-template-columns:repeat(4,1fr)}}
.dbtn{flex-direction:column;align-items:flex-start;gap:4px;min-height:84px;padding:12px;text-align:left;border:1px solid color-mix(in srgb,var(--dc) 55%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--dc) 22%,#10222a),#0d1c22)}
.dbtn b{font-size:17px;color:var(--parch)}.dbtn small{color:var(--muted);font-size:11.5px;line-height:1.4;font-weight:500}
.dbtn:hover:not(:disabled){border-color:var(--dc);background:linear-gradient(180deg,color-mix(in srgb,var(--dc) 32%,#10222a),#0d1c22)}
.rankbox{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.rankhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.rankhead h2{margin:0;font:800 20px/1 var(--display);color:var(--gold-hi)}
.rf{display:flex;gap:4px;flex-wrap:wrap}
.rf button{min-height:30px;padding:0 10px;font-size:12px;border-radius:999px}
.rf button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
#rank table{width:100%;border-collapse:collapse;font-size:13px}
#rank th{padding:6px 6px;text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line)}
#rank td{padding:8px 6px;border-bottom:1px solid #ffffff0d;color:var(--parch);vertical-align:middle}
#rank td.num{font:600 12px/1.2 var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
#rank tr.mine td{background:#c8aa6e14}
#rank small{color:var(--muted)}
.dtag{display:inline-block;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--dc) 25%,transparent);color:var(--parch);font-size:11.5px;font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 60%,transparent)}
.res{font-weight:800}.res.win{color:#5ee0a8}.res.lose{color:#ff8a94}
.empty{margin:10px 0;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:520px){#rank th:nth-child(3),#rank td:nth-child(3){font-size:11px}#rank small{display:none}}

/* 프롤로그 */
#prologue{position:fixed;inset:0;z-index:5;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 16px;text-align:center;
  background:linear-gradient(180deg,#123039 0%,var(--void) 50%,#120d05 100%)}
#prologue h2{margin:0;font:900 clamp(38px,10vw,72px)/.95 var(--display);color:#e9cf93;letter-spacing:.01em;text-shadow:0 2px 0 #6b5428,0 8px 18px #000a}
#prologue .sub{margin:0;max-width:34ch;text-wrap:balance;color:var(--muted);font-size:15px}
#prologue .wrap{width:100%;max-width:820px}
#prologue .tag{position:absolute;left:10px;bottom:10px;padding:3px 8px;border-radius:4px;background:#000b;color:var(--gold-hi);font-size:11px;font-weight:700}
#prologue .caption{bottom:auto;top:10px}
#plogin{min-height:50px;padding:0 26px;gap:10px;background:#fff;color:#1f1f1f;font-weight:700;font-size:15px;border:0;border-radius:999px;box-shadow:0 10px 24px -10px #000}
#plogin:hover:not(:disabled){background:#f1f3f4}
#prologue .note{margin:0;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:no-preference){
  #prologue h2{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
  #prologue .wrap{animation:rise 1s .15s cubic-bezier(.16,1,.3,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

#toast{position:fixed;left:50%;bottom:24px;z-index:9;transform:translateX(-50%);padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;
  background:#0b1a20f2;border:1px solid var(--line-strong);color:var(--parch);font-size:13px;box-shadow:0 10px 24px -10px #000}
#toast.on{opacity:1}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#e9c46a" stroke="#8a6a24" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#8a6a24" stroke-width="1.6"/></symbol>
  <symbol id="i-roll" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></symbol>

<script>
const R=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const lvlOf=xp=>xp>=5?3:xp>=2?2:1;
const cap=n=>Math.min(50,n);
const buff=(p,a,h)=>{if(p){p.atk=cap(p.atk+a);p.hp=cap(p.hp+h)}};
const alive=t=>t.filter(p=>p.hp>0);

// 캐릭터 → 펫. 능력은 슈퍼오토펫의 펫 능력을 캐릭터 성격에 맞춰 옮겨 왔다.
const T=(n,t,a,h,d,x={})=>({n,t,a,h,d,...x});
const PETS={
  hugo:T('휴고범',1,2,2,L=>`기절: 랜덤 아군 +${2*L}/+${L}`,{faint(c,L){buff(R(c.mine),2*L,L)}}),
  ajae:T('아재범',1,1,3,L=>`기절: "우기기 아재" ${L}/${L} 소환`,{faint(c,L){summon(c.mine,c.idx,'ajaeT',L,L)}}),
  jongryeong:T('빽종령',1,2,2,L=>`전투 시작: 랜덤 적에게 1 피해 ×${L}`,{start(c,L){for(let i=0;i<L;i++)dmg(R(alive(c.foe)),1,c.me)}}),
  ttalgak:T('날먹세',1,2,1,L=>`판매: 골드 +${L} 추가`,{sell(S,me,L){S.gold+=L}}),
  seohyun:T('일병3호봉',2,3,1,L=>`기절: 뒤 아군 2명 +${L}/+${L}`,{f:'private-four',faint(c,L){c.mine.slice(c.idx,c.idx+2).forEach(f=>buff(f,L,L))}}),
  drunk:T('만취범',2,3,2,L=>`기절: 모든 펫에게 ${2*L} 피해`,{faint(c,L){[...c.mine,...c.foe].forEach(p=>dmg(p,2*L,c.me))}}),
  songstar:T('송스타',2,2,4,L=>`피격 후 생존: 공격 +${2*L}`,{hurt(c,L){if(c.me.hp>0)c.me.atk=cap(c.me.atk+2*L)}}),
  kumho:T('금호관장',3,1,5,L=>`기절: 뒤 아군 ${L}명에게 발목보호대(피해 -20) 지급`,{faint(c,L){c.mine.slice(c.idx,c.idx+L).forEach(f=>f.perk='melon')}}),
  percival:T('퍼시벌',3,2,3,L=>`앞 아군이 공격할 때: +${L}/+${L}`,{ahead(c,L){buff(c.me,L,L)}}),
  yunhwan:T('카사노바 윤',3,3,3,L=>`피격: 랜덤 적에게 ${2*L} 피해`,{hurt(c,L){dmg(R(alive(c.foe)),2*L,c.me)}}),
  jiseong:T('김치성',3,2,3,L=>`기절: "역전 치성" ${2*L}/${2*L} 두 명 소환`,{faint(c,L){summon(c.mine,c.idx,'chiT',2*L,2*L);summon(c.mine,c.idx,'chiT',2*L,2*L)}}),
  leesin:T('리신범',4,4,3,L=>`전투 시작: 체력이 가장 낮은 적에게 ${4*L} 피해`,{start(c,L){const a=alive(c.foe);if(a.length)dmg(a.reduce((m,p)=>p.hp<m.hp?p:m),4*L,c.me)}}),
  adam:T('아담 성',4,3,5,L=>`턴 종료: Lv2 이상 다른 아군 2명 +${L}/+${L}`,{endTurn(S,me,L){shuffle(S.team.filter(p=>p&&p!==me&&lvlOf(p.xp)>=2)).slice(0,2).forEach(p=>buff(p,L,L))}}),
  sleepy:T('졸린 지킬',4,4,5,L=>`적 처치: +${2*L}/+${2*L}`,{kill(c,L){buff(c.me,2*L,2*L)}}),
  aribeom:T('매혹범',4,3,4,L=>`전투 시작: 공격력이 가장 높은 적 공격 -${2*L}`,{start(c,L){const a=alive(c.foe);if(a.length){const t=a.reduce((m,p)=>p.atk>m.atk?p:m);t.atk=Math.max(1,t.atk-2*L)}}}),
  hyde:T('하이드',5,4,4,L=>`아군 기절: +${2*L}/+${L}`,{friendFaint(c,L){buff(c.me,2*L,L)}}),
  godyung:T('갓융자',5,6,3,L=>`적 처치: 맨 앞 적에게 ${4*L} 피해`,{kill(c,L){dmg(alive(c.foe)[0],4*L,c.me)}}),
  gambler:T('올인 도박사',5,5,5,L=>`전투 시작: ${40+10*L}% 확률로 공·체 2배, 실패하면 절반`,{start(c,L){const p=c.me;if(Math.random()<.4+.1*L){p.atk=cap(p.atk*2);p.hp=cap(p.hp*2)}else{p.atk=Math.ceil(p.atk/2);p.hp=Math.ceil(p.hp/2)}}}),
  ninja:T('맹타치',5,5,4,L=>`전투 시작: 맨 뒤 적에게 ${5*L} 피해`,{start(c,L){const a=alive(c.foe);dmg(a[a.length-1],5*L,c.me)}}),
  jh:T('지킬앤 하이범',6,6,7,L=>`전투 시작: 랜덤 적에게 공격력 절반 피해 ×${L}`,{f:'jekyll-hyde',start(c,L){for(let i=0;i<L;i++)dmg(R(alive(c.foe)),Math.ceil(c.me.atk/2),c.me)}}),
  pastor:T('허허 목사',6,4,8,L=>`기절: 모든 아군 +${2*L}/+${2*L}`,{faint(c,L){c.mine.forEach(f=>buff(f,2*L,2*L))}}),
  infibot:T('무한 리턴 봇',2,1,4,L=>`피격 후 생존: 발목보호대 획득 (전투당 ${L}회)`,{hurt(c,L){const p=c.me;if(p.hp>0&&p.uses<L){p.uses++;p.perk='melon'}}}),
  boss:T('탁구 마왕',6,7,7,L=>`턴 종료: 다른 아군 모두 +${L}/+${L}`,{endTurn(S,me,L){S.team.forEach(p=>p&&p!==me&&buff(p,L,L))}}),
  minhee:T('민희쌤',6,5,6,L=>`턴 종료: 랜덤 다른 아군 ${L}명 경험치 +1 (레슨)`,{endTurn(S,me,L){shuffle(S.team.filter(p=>p&&p!==me&&p.xp<5)).slice(0,L).forEach(p=>{buff(p,1,1);gainXp(S,p,1)})}}),
  ajaeT:T('우기기 아재',0,1,1,()=>'',{f:'ajae'}),
  chiT:T('역전 치성',0,2,2,()=>'',{f:'jiseong'}),
  bee:T('꿀벌',0,1,1,()=>'',{f:null}),
};

const TRAIT_OF={hugo:['atk'],ajae:['vet'],jongryeong:['def','vet'],ttalgak:['tech'],seohyun:['atk'],drunk:['vet','comeback'],songstar:['def'],
  infibot:['def'],kumho:['def','vet'],percival:['atk'],yunhwan:['def'],jiseong:['comeback'],leesin:['atk'],adam:['tech'],sleepy:['dual'],
  aribeom:['boss','tech'],hyde:['dual'],godyung:['boss','tech'],gambler:['atk','comeback'],ninja:['tech'],jh:['dual'],pastor:['vet'],boss:['boss'],minhee:['boss','atk']};
const hasTrait=(key,t)=>(TRAIT_OF[key]||[]).includes(t);
function traitCounts(team){const seen=new Set(),c={};for(const p of team)if(p&&!seen.has(p.key)){seen.add(p.key);(TRAIT_OF[p.key]||[]).forEach(t=>c[t]=(c[t]||0)+1)}return c}
const traitLv=(t,n)=>TRAITS[t].th.filter(x=>n>=x).length;   // 0 = 꺼짐, 1, 2

// ---------- 상점 (플레이어와 봇이 같은 규칙을 쓴다) ----------
let uid=0;
const mk=(key,atk=PETS[key].a,hp=PETS[key].h)=>({uid:++uid,key,atk,hp,xp:0,perk:null});
const maxTier=S=>Math.min(6,Math.ceil(S.turn/2));
const petSlots=S=>S.turn>=9?5:S.turn>=5?4:3;
const foodSlots=S=>S.turn>=3?2:1;
const pickPet=(lo,hi)=>R(Object.keys(PETS).filter(k=>PETS[k].t>=lo&&PETS[k].t<=hi));
const pickFood=hi=>R(Object.keys(FOODS).filter(k=>FOODS[k].t<=hi));
const shopPet=key=>({key,atk:PETS[key].a,hp:PETS[key].h,frozen:false});

function newState(human){return{human,turn:0,gold:10,lives:5,wins:0,team:[null,null,null,null,null],shop:{pets:[],food:[]}}}
function roll(S){
  const sp=S.shop;
  sp.pets=sp.pets.filter(x=>x.frozen);sp.food=sp.food.filter(x=>x.frozen);
  while(sp.pets.length<petSlots(S))sp.pets.push(shopPet(pickPet(1,maxTier(S))));
  while(sp.food.length<foodSlots(S))sp.food.push({key:pickFood(maxTier(S)),frozen:false});
}
function gainXp(S,p,n){
  const before=lvlOf(p.xp);p.xp=Math.min(5,p.xp+n);
  if(lvlOf(p.xp)>before){
    const t=Math.min(6,maxTier(S)+1);
    S.shop.pets.push({...shopPet(pickPet(t,t)),bonus:true});
    if(S.human)toast(`${PETS[p.key].n} Lv${lvlOf(p.xp)}! 상점에 ${t}코스트 보너스 캐릭터`);
  }
}
function merge(S,t,src){t.atk=cap(Math.max(t.atk,src.atk)+1);t.hp=cap(Math.max(t.hp,src.hp)+1);gainXp(S,t,src.xp+1)}
function buyPet(S,i,slot){
  const it=S.shop.pets[i],t=S.team[slot];
  if(S.gold<3)return'골드가 부족해요';
  if(t&&(t.key!==it.key||t.xp>=5))return'같은 캐릭터끼리만 합칠 수 있어요';
  S.gold-=3;S.shop.pets.splice(i,1);
  const p=mk(it.key,it.atk,it.hp);
  if(t)merge(S,t,p);else S.team[slot]=p;
}
function buyFood(S,i,p){
  if(S.gold<3)return'골드가 부족해요';
  const f=FOODS[S.shop.food[i].key];
  if(!p&&!f.all)return'장비를 줄 캐릭터를 고르세요';
  if(!S.team.some(Boolean))return'팀에 펫이 없어요';
  S.gold-=3;S.shop.food.splice(i,1);
  if(f.all)shuffle(S.team.filter(Boolean)).slice(0,f.all[0]).forEach(x=>buff(x,f.all[1],f.all[1]));
  else if(f.perk)p.perk=Object.keys(FOODS).find(k=>FOODS[k]===f);
  else f.use(S,p);
}
function sell(S,slot){const p=S.team[slot];S.team[slot]=null;S.gold+=lvlOf(p.xp);PETS[p.key].sell?.(S,p,lvlOf(p.xp))}
function reroll(S){if(S.gold<1)return'골드가 부족해요';S.gold--;roll(S)}
function startTurn(S){S.turn++;S.gold=10;roll(S);S.team.forEach(p=>p&&PETS[p.key].startTurn?.(S,p,lvlOf(p.xp)))}
function endTurn(S){S.team.forEach(p=>p&&PETS[p.key].endTurn?.(S,p,lvlOf(p.xp)))}

// ponytail: 탐욕적인 봇 (합성 > 빈칸 채우기 > 상위 티어로 교체 > 장비 > 리롤). 실제 게임처럼 다른 유저 팀이 필요하면 Firebase에 팀을 저장해 불러오면 된다.
const score=p=>PETS[p.key].t*10+p.atk+p.hp;
// AI 난이도: 턴마다 더 받는 골드, 턴 종료 강화, 이지는 합성을 자주 놓치고 아무거나 산다
const DIFFS={
  easy:{n:'이지',c:'#17b98a',gold:-3,d:'골드를 덜 받고, 아무 캐릭터나 사요'},
  hard:{n:'하드',c:'#3389e6',gold:0,d:'나와 같은 규칙으로 꼼꼼하게 팀을 짜요'},
  extreme:{n:'익스트림',c:'#c24de2',gold:2,d:'골드 +2, 매 턴 랜덤 캐릭터 2명 +1/+1'},
  ultra:{n:'울트라',c:'#ff5470',gold:4,d:'골드 +4, 매 턴 모든 캐릭터 +1/+1'},
};
function diffBuff(S,d){
  const t=S.team.filter(Boolean);
  if(d==='extreme')shuffle(t).slice(0,2).forEach(p=>buff(p,1,1));
  if(d==='ultra')t.forEach(p=>buff(p,1,1));
}
function botPlay(S,careless=false){
  for(let g=0;g<40;g++){
    const team=S.team,sp=S.shop.pets,empty=team.indexOf(null);
    if(S.gold>=3){
      const mi=sp.findIndex(x=>team.some(p=>p&&p.key===x.key&&p.xp<5));
      if(mi>=0&&!(careless&&Math.random()<.6)){buyPet(S,mi,team.findIndex(p=>p&&p.key===sp[mi].key&&p.xp<5));continue}
      const best=sp.map((x,i)=>[careless?Math.random():PETS[x.key].t+Math.random(),i]).sort((a,b)=>b[0]-a[0])[0];
      if(best&&empty>=0){buyPet(S,best[1],empty);continue}
      if(best){const weak=team.reduce((m,p)=>score(p)<score(m)?p:m);if(PETS[sp[best[1]].key].t>PETS[weak.key].t){sell(S,team.indexOf(weak));continue}}
      if(S.shop.food.length&&team.some(Boolean)){buyFood(S,0,R(team.filter(Boolean)));continue}
    }
    if(S.gold>=4){reroll(S);continue}
    break;
  }
}

// ---------- 전투 ----------
let B;
const P=p=>PETS[p.key];
const ctx=p=>{const mine=B.A.includes(p)?B.A:B.B;return{me:p,mine,foe:mine===B.A?B.B:B.A}};
function dmg(t,n,src){
  if(!t||t.hp<=0||n<=0)return;
  if(t.dr)n=Math.max(1,n-t.dr);
  if(t.perk==='garlic')n=Math.max(1,n-2);
  if(t.perk==='melon'){n=Math.max(0,n-20);t.perk=null}
  B.ev.push({s:src?.uid,t:t.uid,n});
  if(n<=0)return;
  t.hp-=n;B.q.push(t);
  if(t.hp>0)t.mp=Math.min(100,(t.mp||0)+10);
  if(t.hp<=0)t.killer=src;
}
function summon(side,i,key,a,h){if(side.length<5)side.splice(Math.min(i,side.length),0,{...mk(key,a,h),L:1,uses:0,mx:h,mp:0})}
function snap(msg,kind=''){const c=t=>t.map(p=>({uid:p.uid,key:p.key,atk:p.atk,hp:Math.max(0,p.hp),mx:p.mx,mp:p.mp,perk:p.perk,L:p.L}));B.frames.push({A:c(B.A),B:c(B.B),msg,kind,ev:B.ev});B.ev=[]}
function resolve(){
  for(let g=0;g<300;g++){
    if(B.q.length){const t=B.q.shift();P(t).hurt?.(ctx(t),t.L);continue}
    let side=B.A.some(p=>p.hp<=0)?B.A:B.B.some(p=>p.hp<=0)?B.B:null;
    if(!side)return;
    const i=side.findIndex(p=>p.hp<=0),dead=side[i];
    const c={me:dead,mine:side,foe:side===B.A?B.B:B.A,idx:i};
    side.splice(i,1);
    P(dead).faint?.(c,dead.L);
    if(dead.perk==='honey')summon(side,i,'bee',1,1);
    [...side].forEach(f=>P(f).friendFaint?.(ctx(f),f.L));
    const tl=side.tl||{};
    if(tl.dual)side.forEach(f=>{if(hasTrait(f.key,'dual'))f.atk=cap(f.atk+2*tl.dual)});
    if(tl.comeback&&hasTrait(dead.key,'comeback'))side.forEach(f=>buff(f,2*tl.comeback,2*tl.comeback));
    const k=dead.killer;if(k&&k.hp>0)P(k).kill?.(ctx(k),k.L);
    snap(`${P(dead).n} 기절`);
  }
}
function castUlt(p){
  const c=ctx(p),A=p.atk,f=()=>alive(c.foe),half=Math.max(1,Math.ceil(A/2));
  switch(ultOf(p.key).t){
    case 'loop':dmg(f()[0],A*2,p);break;
    case 'lightning':{const a=f();dmg(a[0],Math.ceil(A*1.5),p);dmg(a[1],half,p);break}
    case 'thunder':f().forEach(e=>dmg(e,half,p));break;
    case 'crescent':{const a=f();dmg(a[a.length-1],Math.ceil(A*1.5),p);break}
    case 'phantom':{const e=f()[0];if(e){e.atk=Math.max(1,Math.ceil(e.atk/2));dmg(e,half,p)}break}
    case 'chop':dmg(f()[0],A,p);p.perk='melon';break;
    case 'chiquita':for(let i=0;i<3;i++)dmg(R(f()),half,p);break;
  }
}
function attackPower(p){let d=p.atk;if(p.perk==='meat')d+=3;if(p.perk==='steak'){d+=20;p.perk=null}return d}
function battle(ta,tb){
  const cl=p=>({...p,L:lvlOf(p.xp),uses:0,mx:p.hp,mp:0});
  B={A:ta.filter(Boolean).map(cl),B:tb.filter(Boolean).map(cl),q:[],frames:[],ev:[]};
  for(const [side,src] of [[B.A,ta],[B.B,tb]]){   // 시너지 적용
    const c=traitCounts(src);side.tl={};for(const t in TRAITS)side.tl[t]=traitLv(t,c[t]||0);
    side.forEach(p=>{p.atk=cap(p.atk+[0,2,5][side.tl.atk]);p.hp=cap(p.hp+[0,3,7][side.tl.vet]);p.mx=p.hp;p.dr=[0,1,2][side.tl.def];p.mp=[0,40,80][side.tl.tech]});
  }
  snap('전투 시작!');
  for(const [side,foe] of [[B.A,B.B],[B.B,B.A]])if(side.tl.boss){foe.forEach(e=>dmg(e,2*side.tl.boss,null));snap(`시너지 · 보스 ${side===B.A?'(내 팀)':'(상대)'}`)}
  for(const p of [...B.A,...B.B].sort((x,y)=>y.atk-x.atk))if(p.hp>0&&P(p).start){P(p).start(ctx(p),p.L);snap(`${P(p).n}: ${P(p).d(p.L)}`)}
  resolve();
  for(let n=0;B.A.length&&B.B.length&&n<100;n++){
    for(const s of [B.A,B.B])if(s[1])P(s[1]).ahead?.(ctx(s[1]),s[1].L);
    const a=B.A[0],b=B.B[0],da=attackPower(a),db=attackPower(b);
    dmg(b,da,a);dmg(a,db,b);
    for(const p of [a,b])if(p.hp>0)p.mp=Math.min(100,(p.mp||0)+35);
    snap(`${P(a).n} ⚔ ${P(b).n}`,'attack');
    resolve();
    for(const s of [B.A,B.B])for(const p of [...s])if(p.hp>0&&p.mp>=100&&ultOf(p.key)){p.mp=0;castUlt(p);snap(`${P(p).n} 필살기 · ${ultOf(p.key).n}`,'ult');resolve()}
  }
  const r=B.A.length&&!B.B.length?'win':!B.A.length&&B.B.length?'lose':'draw';
  return{frames:B.frames,r};
}

// ---------- 보드 (롤토체스식 육각 보드 위에서 탁구채를 든 캐릭터가 싸운다) ----------
const $=id=>document.getElementById(id);
const TC=['#6b7280','#a3acb5','#17b98a','#3389e6','#c24de2','#f5b335','#ff5470'];   // 티어 색 (0 = 소환물)
const IMG={};
function faceOf(key){const d=PETS[key],f=d.f===undefined?key:d.f;return f&&(IMG[f]||(IMG[f]=Object.assign(new Image(),{src:`faces/${f}-face.png`})))}
const SLOT=[[0,2],[0,1],[0,3],[1,1],[1,2]];   // 팀 순서 → [앞에서 몇째 줄, 칸]. 0번이 맨 앞 (한 팀 2줄 × 5칸)

function makeArena(cv){
  const g=cv.getContext('2d'),U=new Map();
  let hoverSlot=-1,banner=null,W=0,H=0,parts=[],proj=[],fx=[],fl=[],frames=[],fi=-1,t0=0,Dk=800,D=800,raf=0,last=0,onDone=null,cap=null,still=false,selSlot=-1;

  const pos=(side,i)=>{const[dr,c]=SLOT[Math.min(i,4)];return tile(c,side==='A'?2+dr:1-dr)};
  const spawn=o=>{if(parts.length<700)parts.push({born:performance.now(),g:0,drag:1,...o})};

  // ----- 유닛 상태 -----
  function upsert(side,i,p,now){

  // ----- 이펙트 -----

  // ----- 자세와 동작 -----
  function actPose(u,now,lag=0){
    const P={ox:0,oy:0,sc:1,rot:0,arm:null,charge:0,kick:0,alpha:1,top:false,striking:0};
    const a=u.act;if(!a)return P;
    const p=(now-lag-a.t0)/a.dur;if(p<0||p>1)return P;
    const c=clamp(p/.35),s=clamp((p-.35)/(a.imp-.35)),r=clamp((p-a.imp)/(1-a.imp));

  function idlePose(u,now,moving){

  }

  // ----- 그리기 -----
  function edge(rf){const top=H*.22,bot=H*.99,rh=(bot-top)/4,p=.84+.16*rf/3,w=Math.min(W*.92/5.6,rh*1.25)*p;return{y:top+(rf+.5)*rh,hw:w*2.95,rh}}
  function drawTable(){   // 탁구대: 파란 상판, 흰 테두리 선과 가운데 선, 앞쪽 두께

    g.strokeStyle='rgba(200,170,110,.5)';g.lineWidth=1;g.beginPath();g.moveTo(W/2-b.hw,b.y+th);g.lineTo(W/2+b.hw,b.y+th);g.stroke();

  function drawNet(){   // 가운데 네트: 기둥 · 그물 · 흰 테이프

  function hexPath(x,y,r){g.beginPath();for(let k=0;k<6;k++){const a=Math.PI/3*k+Math.PI/6;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r*.62)}g.closePath()}
  function line(x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
  function auraBack(u,k,x,y,now,charge){

    if(u.L>=3){   // 초사이언 아우라: 금빛 불꽃이 위로 솟는다

    skip(){if(!frames.length)return;const now=performance.now();enter(frames.length-1,now);flush(now);proj=[];t0=now-Dk-1},
    team(t,s){fit();still=true;frames=[];onDone=null;fx=[];proj=[];U.clear();selSlot=s;const now=performance.now();
      t.forEach((p,j)=>{if(p){const u=upsert('A',j,{...p,L:lvlOf(p.xp),mx:p.hp},now);u.born=-1e9;apply(u,u.next,now,false)}})},
    slotAt(x,y){let best=-1,bd=1e9;for(let j=0;j<5;j++){const t=pos('A',j),d=Math.hypot(x-t.x,(y-(t.y-t.w*.5))*.8);if(d<t.w*.9&&d<bd){bd=d;best=j}}return best},
    speed(v){D=800/v},
    hover(j){hoverSlot=j},
    start(){if(!raf){last=0;raf=requestAnimationFrame(loop)}},
    stop(){cancelAnimationFrame(raf);raf=0},
  };
}

// ---------- 화면 ----------
let me,bot,foeName,sel=null,mode='shop',fast=false;
const board=makeArena($('board')),pboard=makeArena($('pboard'));
const isSel=(src,i)=>sel&&sel.src===src&&sel.i===i?'sel':'';
const COIN='<svg class="coin"><use href="#i-coin"/></svg>';
function render(){
  const myTr=traitCounts(me.team),owned=k=>me.team.some(p=>p&&p.key===k);
  $('stage').innerHTML=`<span style="color:${DIFFS[me.diff]?.c}">${DIFFS[me.diff]?.n||''}</span> 라운드 <span class="num">${me.turn}</span>`;
  $('gold').textContent=me.gold;
  $('trophy').innerHTML=`<svg class="ico" style="width:15px;height:15px;color:var(--gold)"><use href="#i-trophy"/></svg><span class="num">${me.wins}</span>/10`;
  $('players').innerHTML=`<div class="pl me"><b>나</b><span class="num">${me.lives}</span><div class="bar"><i style="width:${me.lives*20}%"></i></div></div><div class="pl foe"><b>${foeName}</b><span></span><div class="bar"><i style="width:100%"></i></div></div>`;
  $('shop').innerHTML=me.shop.pets.map((x,i)=>{const d=PETS[x.key];return`<div class="sc ${isSel('pet',i)} ${x.frozen?'frozen':''} ${owned(x.key)?'owned':''} ${x.bonus?'bonus':''}" style="--tc:${TC[d.t]}" data-pet="${i}" role="button" aria-label="${d.n} ${d.t}코스트, 3골드${owned(x.key)?', 보드에 있음':''}${x.bonus?', 레벨업 보너스':''}"><img src="faces/${d.f||x.key}-face.png" alt="" draggable="false"><span class="st"><b>${x.atk}</b><b>${x.hp}</b></span><span class="tt">${(TRAIT_OF[x.key]||[]).map(t=>`<i class="${myTr[t]?'has':''}" style="--tc:${TRAITS[t].c}">${TRAITS[t].s}</i>`).join('')}</span>${owned(x.key)?'<span class="spark" aria-hidden="true"></span>':''}${x.bonus?'<span class="bonus-tag">레벨업 보너스</span>':''}<span class="cb">${d.t}<small>코</small></span><div class="plate"><span>${d.n}</span></div></div>`}).join('')
    +'<div class="sep"></div>'
    +me.shop.food.map((x,i)=>{const f=FOODS[x.key];return`<div class="sc ${isSel('food',i)} ${x.frozen?'frozen':''}" style="--tc:${TC[f.t]}" data-food="${i}" role="button" aria-label="${f.n} 3골드"><div class="emo">${foodSvg(x.key,54)}</div><span class="cb">${f.t}<small>코</small></span><div class="plate"><span>${f.n}</span></div></div>`}).join('');
  let info='상점 카드를 보드 칸으로 끌어다 놓거나, 카드를 누른 뒤 칸을 누르세요. 같은 캐릭터 위에 놓으면 합쳐져요. 3마리면 ★★, 6마리면 ★★★.';
  if(sel?.src==='food'){const f=FOODS[me.shop.food[sel.i].key];info=`<strong>${f.n}</strong><span class="meta">${f.t}코스트 · 3골드</span><br>${f.d}. ${f.all?'보드의 아무 캐릭터나 누르면 사용해요.':'장착할 캐릭터를 누르세요. 끌어다 놓아도 돼요.'}`}
  else if(sel){const p=sel.src==='team'?me.team[sel.i]:me.shop.pets[sel.i],d=PETS[p.key],L=p.xp!=null?lvlOf(p.xp):1,u=ultOf(p.key),ts=TRAIT_OF[p.key]||[];
    info=`<strong style="color:${TC[d.t]==='#a3acb5'?'var(--parch)':TC[d.t]}">${d.n}</strong><span class="meta">${d.t}코스트 · ${'★'.repeat(L)} · ${sel.src==='team'?`팔면 ${L}골드`:'3골드'}</span><br>${d.d(L)}`
      +(u?`<span class="ult"><b style="color:${u.c}">${u.n}</b> 필살기 · ${ULT_DESC[u.t]}</span>`:'')
      +(p.perk?`<span class="ult">${foodSvg(p.perk,16)} ${FOODS[p.perk].d}</span>`:'')
      +(ts.length?`<span class="chips">${ts.map(t=>`<span class="chip" style="--tc:${TRAITS[t].c}"><i></i>${TRAITS[t].n}</span>`).join('')}</span>`:'')
      +(sel.src==='team'?'<span class="ult">빈 칸이나 다른 캐릭터를 누르면 자리를 옮겨요.</span>':'')}
  $('info').innerHTML=info;
  $('traits').innerHTML=traitList(me.team);$('ftraits').innerHTML=traitList(bot.team);   // 왼쪽 내 팀 · 오른쪽 상대 팀
  $('roll').disabled=me.gold<1;
  $('freeze').disabled=!sel||sel.src==='team';
  $('freeze').querySelector('span').textContent=sel&&sel.src!=='team'&&(sel.src==='pet'?me.shop.pets:me.shop.food)[sel.i].frozen?'녹이기':'얼리기';
  $('sell').disabled=sel?.src!=='team';
  if(mode==='shop'){board.team(me.team,sel?.src==='team'?sel.i:-1);$('caption').textContent=''}
}
function traitList(team){   // 시너지 목록: 엠블럼 · 이름 · 단계(닿은 단계는 밝게) · 현재 인원/다음 단계 인원
  const tc=traitCounts(team);
  return Object.keys(tc).sort((a,b)=>traitLv(b,tc[b])-traitLv(a,tc[a])||tc[b]-tc[a]).map(t=>{const T=TRAITS[t],n=tc[t],lv=traitLv(t,n),next=T.th.find(x=>x>n)??T.th[T.th.length-1];
    return`<div class="tr ${lv?'on':''} ${lv===T.th.length?'max':''}" style="--tc:${T.c}" title="${T.th.map((x,i)=>`${x}: ${T.d[i]}`).join(' / ')}"><span class="emb"><i></i></span><span class="trtxt"><span class="tn">${T.n}</span><span class="bp">${T.th.map(x=>`<em class="${n>=x?'hit':''}">${x}</em>`).join('<em>›</em>')}</span></span><span class="cnt">${n}/${next}</span></div>`}).join('');
}
let tt;function toast(m){$('toast').textContent=m;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),1800)}
function fail(m){if(m)toast(m);return m}
function teamClick(j){
  const t=me.team[j];
  if(sel?.src==='pet'){if(!fail(buyPet(me,sel.i,j)))sel=null}
  else if(sel?.src==='food'){if(!fail(buyFood(me,sel.i,t)))sel=null}
  else if(sel?.src==='team'){
    const a=me.team[sel.i];
    if(sel.i!==j){if(t&&t.key===a.key&&t.xp<5){merge(me,t,a);me.team[sel.i]=null}else{me.team[sel.i]=t;me.team[j]=a}}
    sel=null;
  }else if(t)sel={src:'team',i:j};
}
document.addEventListener('click',e=>{
  if(mode!=='shop'||noClick)return;
  if(e.target.id==='board'){const r=e.target.getBoundingClientRect(),j=board.slotAt(e.clientX-r.left,e.clientY-r.top);if(j>=0)teamClick(j);else sel=null;return render()}
  const el=e.target.closest('[data-pet],[data-food]');if(!el)return;
  if(el.dataset.pet!=null){const i=+el.dataset.pet;sel=isSel('pet',i)?null:{src:'pet',i}}
  else{const i=+el.dataset.food;sel=isSel('food',i)?null:{src:'food',i}}
  render();
});
let drag=null,noClick=false,pan=null;
$('shop').addEventListener('wheel',e=>{const el=$('shop');if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){e.preventDefault();el.scrollBy({left:e.deltaY,behavior:'auto'})}},{passive:false});
document.addEventListener('pointerdown',e=>{
  if(mode!=='shop'||e.button>0)return;const el=e.target.closest('[data-pet],[data-food]');if(!el)return;
  drag={el,x:e.clientX,y:e.clientY,src:el.dataset.pet!=null?'pet':'food',i:+(el.dataset.pet??el.dataset.food),ghost:null,touch:e.pointerType!=='mouse'};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.ghost){
    if(Math.hypot(dx,dy)<8)return;
    if(Math.abs(dx)>Math.abs(dy)){   // 옆으로 밀면 상점 줄 스크롤 (터치는 브라우저가, 마우스는 직접)
      if(!drag.touch){pan={x:e.clientX,left:$('shop').scrollLeft,v:0,t:performance.now()};$('shop').classList.add('grabbing')}
      drag=null;return}
    sel={src:drag.src,i:drag.i};render();
    const el=$('shop').querySelector(`[data-${drag.src}="${drag.i}"]`);el?.classList.add('dragging');
    drag.ghost=el.cloneNode(true);drag.ghost.classList.remove('dragging','sel');drag.ghost.classList.add('ghost');document.body.append(drag.ghost);
  }
  e.preventDefault();
  drag.ghost.style.transform=`translate(${e.clientX-43}px,${e.clientY-90}px) rotate(-4deg) scale(1.06)`;
  const r=$('board').getBoundingClientRect();board.hover(board.slotAt(e.clientX-r.left,e.clientY-r.top));
},{passive:false});
function endDrag(e,drop){
  if(!drag)return;const d=drag;drag=null;if(!d.ghost)return;
  d.ghost.remove();board.hover(-1);noClick=true;setTimeout(()=>noClick=false,0);
  if(drop){const r=$('board').getBoundingClientRect(),j=board.slotAt(e.clientX-r.left,e.clientY-r.top);if(j>=0){sel={src:d.src,i:d.i};teamClick(j)}}
  render();
}
document.addEventListener('pointermove',e=>{if(!pan)return;const el=$('shop'),now=performance.now(),nl=pan.left-(e.clientX-pan.x);pan.v=(nl-el.scrollLeft)/Math.max(1,now-pan.t);pan.t=now;el.scrollLeft=nl});
document.addEventListener('pointerup',()=>{if(!pan)return;const el=$('shop'),v=pan.v;pan=null;noClick=true;setTimeout(()=>noClick=false,0);   // 놓으면 관성으로 조금 더 미끄러진다
  el.classList.remove('grabbing');el.scrollBy({left:v*180,behavior:'smooth'})});
document.addEventListener('pointerup',e=>endDrag(e,true));
document.addEventListener('pointercancel',e=>endDrag(e,false));
$('roll').onclick=()=>{fail(reroll(me));sel=sel?.src==='team'?sel:null;render()};
$('freeze').onclick=()=>{const it=(sel.src==='pet'?me.shop.pets:me.shop.food)[sel.i];it.frozen=!it.frozen;render()};
$('sell').onclick=()=>{sell(me,sel.i);sel=null;render()};
$('speed').onclick=()=>{fast=!fast;board.speed(fast?2:1);$('speed').querySelector('span').textContent=fast?'1배속':'2배속'};
$('skip').onclick=()=>board.skip();
$('end').onclick=()=>{
  if(!me.team.some(Boolean))return toast('캐릭터를 한 명 이상 보드에 놓으세요');
  sel=null;endTurn(me);
  const {frames,r}=battle(me.team,bot.team);
  mode='battle';$('shopbar').hidden=$('info').hidden=true;$('bctl').hidden=false;$('next').hidden=true;$('skip').hidden=false;
  board.play(frames,()=>{
    $('skip').hidden=true;$('next').hidden=false;
    const loss=1;   // 지면 체력 1만 깎인다
    if(r==='win')me.wins++;else if(r==='lose')me.lives=Math.max(0,me.lives-loss);
    const over=me.wins>=10?'트로피 10개! 우승이에요':me.lives<=0?`게임 오버 · 트로피 ${me.wins}개`:'';
    $('caption').textContent=(r==='win'?'승리! 트로피 +1':r==='lose'?`패배… 체력 -${loss}`:'무승부')+(over?` — ${over}`:'');
    $('next').textContent=over?'로비로':'다음 턴';
    if(over){stats.games++;stats.best=Math.max(stats.best,me.wins);if(me.wins>=10)stats.champs++;record(me.wins>=10?'win':'lose',me.wins,me.diff);save()}
    $('next').onclick=()=>{mode='shop';$('shopbar').hidden=$('info').hidden=false;$('bctl').hidden=true;over?showScreen('lobby'):nextTurn()};
  },$('caption'));
};
// 프롤로그: 봇 두 팀을 몇 턴 키운 뒤 실제 전투를 계속 돌려 보여 준다.
let demoTimer;
function demo(){
  clearTimeout(demoTimer);
  const a=newState(false),b=newState(false),turns=4+Math.floor(Math.random()*7);
  for(let t=0;t<turns;t++)for(const s of [a,b]){startTurn(s);botPlay(s);endTurn(s)}
  pboard.play(battle(a.team,b.team).frames,()=>{demoTimer=setTimeout(demo,1800)},$('pmsg'));
}
function gate(signedIn){showScreen(signedIn?'lobby':'prologue')}
function nextTurn(){const d=me.diff||'hard';startTurn(me);startTurn(bot);bot.gold=Math.max(0,bot.gold+DIFFS[d].gold);botPlay(bot,d==='easy');endTurn(bot);diffBuff(bot,d);render();save()}
function newGame(diff){me=newState(true);me.diff=diff;bot=newState(false);foeName=PETS[pickPet(1,6)].n+'의 팀';sel=null;if(diff)nextTurn()}
const started=()=>me&&me.diff&&me.turn>0&&me.lives>0&&me.wins<10;
function startGame(diff){if(diff)newGame(diff);showScreen('game')}
function showScreen(sc){   // prologue · lobby · game
  $('prologue').hidden=sc!=='prologue';$('lobby').hidden=sc!=='lobby';document.querySelector('main').hidden=sc!=='game';
  clearTimeout(demoTimer);pboard.stop();board.stop();
  if(sc==='prologue'){pboard.start();demo()}
  if(sc==='game'){mode='shop';$('shopbar').hidden=$('info').hidden=false;$('bctl').hidden=true;board.start();render()}
  if(sc==='lobby'){$('diffs').hidden=true;$('resume').hidden=!started();if(started())$('resume').querySelector('span').textContent=`이어하기 · ${DIFFS[me.diff]?.n||'하드'} 라운드 ${me.turn}`;loadRank()}
}

const FIREBASE_CONFIG={apiKey:"AIzaSyDVSIKBSg-CWGMDJHzFNmxTDacpWo2s1J0",authDomain:"auto-ping-pong-b04bd.firebaseapp.com",

let fb=null,user=null,stats={games:0,champs:0,best:0};
function showAccount(){

async function initFirebase(){
  if(!FIREBASE_CONFIG)return;
  const [app,auth,fs]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore-lite.js'].map(f=>import(FB+f)));
  const a=app.initializeApp(FIREBASE_CONFIG);
  fb={auth:auth.getAuth(a),A:auth,db:fs.getFirestore(a),F:fs};
  auth.onAuthStateChanged(fb.auth,async u=>{
    user=u;
    if(u){
      try{
        const s=await fs.getDoc(fs.doc(fb.db,'autopets',u.uid));
        if(s.exists()){
          const d=s.data();stats={games:d.games||0,champs:d.champs||0,best:d.best||0};
          if(d.run){const r=JSON.parse(d.run);me=r.me;me.diff??='hard';bot=r.bot;foeName=r.foeName;uid=r.uid;sel=null}
        }else save();
      }catch(e){console.error(e);toast('기록을 불러오지 못했어요')}
    }
    showAccount();gate(!!u);
    $('plogin').disabled=false;$('plogin').lastChild.textContent='Google로 시작하기';
  });
}
async function save(){
  if(!fb||!user)return;
  const {F,db}=fb;
  try{await F.setDoc(F.doc(db,'autopets',user.uid),{name:(user.displayName||'').slice(0,40),run:started()?JSON.stringify({me,bot,foeName,uid}):'',...stats,at:F.serverTimestamp()})}
  catch(e){console.error(e);toast('저장하지 못했어요')}
}
async function record(result,wins,diff){   // 랭킹 기록: 끝난 판마다 한 줄 (지우거나 고칠 수 없음)
  if(!fb||!user)return;const {F,db}=fb;
  try{await F.addDoc(F.collection(db,'autopets_rank'),{uid:user.uid,name:(user.displayName||'플레이어').slice(0,20),diff:diff||'hard',result,wins,at:F.serverTimestamp()})}
  catch(e){console.error(e);toast('랭킹에 기록하지 못했어요')}
}
let rankFilter='all';
async function loadRank(){
  const box=$('rank');if(!fb||!user){box.innerHTML='<p class="empty">로그인하면 랭킹을 볼 수 있어요</p>';return}
  box.innerHTML='<p class="empty">불러오는 중…</p>';
  const {F,db}=fb;
  try{
    const q=rankFilter==='all'?F.query(F.collection(db,'autopets_rank'),F.orderBy('at','desc'),F.limit(30)):F.query(F.collection(db,'autopets_rank'),F.where('diff','==',rankFilter),F.limit(60));
    const rows=(await F.getDocs(q)).docs.map(d=>d.data()).filter(r=>r.at).sort((a,b)=>b.at.toMillis()-a.at.toMillis()).slice(0,30);
    if(!rows.length){box.innerHTML='<p class="empty">아직 기록이 없어요. 첫 기록의 주인공이 되어 보세요.</p>';return}
    const two=n=>String(n).padStart(2,'0'),when=t=>{const d=t.toDate();return`${d.getFullYear()}.${two(d.getMonth()+1)}.${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`};
    const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
    box.innerHTML=`<table><thead><tr><th>닉네임</th><th>난이도</th><th>날짜 · 시간</th><th>결과</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.uid===user.uid?'mine':''}"><td>${esc(r.name)}</td><td><span class="dtag" style="--dc:${DIFFS[r.diff]?.c}">${DIFFS[r.diff]?.n||r.diff}</span></td><td class="num">${when(r.at)}</td><td><span class="res ${r.result}">${r.result==='win'?'승리':'패배'}</span><small> 트로피 ${r.wins}</small></td></tr>`).join('')}</tbody></table>`;
  }catch(e){console.error(e);box.innerHTML='<p class="empty">랭킹을 불러오지 못했어요</p>'}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rank]');if(!b)return;rankFilter=b.dataset.rank;document.querySelectorAll('[data-rank]').forEach(x=>x.classList.toggle('on',x===b));loadRank()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-diff]');if(b)startGame(b.dataset.diff)});
$('aiBtn').onclick=()=>{$('diffs').hidden=!$('diffs').hidden};

$('toLobby').onclick=()=>{save();showScreen('lobby')};

  if(!fb)return toast('Firebase 연결 준비 중이에요');

}

initFirebase().catch(e=>{console.error(e);$('plogin').lastChild.textContent='연결 실패 · 새로고침해 주세요'});
