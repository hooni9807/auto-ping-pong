<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Ping Pong</title>
<style>
:root{--bg:#0b0e1a;--panel:#141a2e;--line:#2b3556;--text:#eef0ff;--dim:#9aa3c7;--lime:#c8f169;--gold:#f5c542}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:900px;margin:0 auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:16px;margin:0;white-space:nowrap}h1 i,#prologue h2 i{color:var(--lime);font-style:normal}
#stage{margin:0 auto;background:#000a;border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:700;font-size:13px}
.label{color:var(--dim);font-size:12px}
.wrap{position:relative}
canvas.board{display:block;width:100%;aspect-ratio:1/1;max-height:56vh;border-radius:14px;border:1px solid var(--line);background:radial-gradient(90% 70% at 50% 45%,#1d2547 0%,#0d1124 70%);touch-action:manipulation}
@media (min-width:760px){canvas.board{aspect-ratio:16/9;max-height:62vh}}
#players{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.pl{background:#000b;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;min-width:92px}
.pl .bar{height:4px;background:#333;border-radius:2px;margin-top:2px}.pl .bar i{display:block;height:100%;background:#22c55e;border-radius:2px}
.pl.foe .bar i{background:#ef4444}
.caption{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none;font-size:13px}
.traits{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.tr{--tc:#888;display:flex;align-items:center;gap:6px;background:#000b;border:1px solid var(--line);border-radius:8px;padding:2px 8px 2px 4px;font-size:11px;color:var(--dim)}
.tr i{width:14px;height:14px;background:#4b5563;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.tr b{font-variant-numeric:tabular-nums;color:var(--text)}
.tr.on{color:var(--text);border-color:var(--tc)}.tr.on i{background:var(--tc)}
.tr.max{box-shadow:0 0 10px var(--tc)}
.sc .tt{position:absolute;right:3px;top:3px;display:flex;gap:2px}
.sc .tt i{width:9px;height:9px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
#info{min-height:52px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--dim)}
#info strong{color:var(--text)}
#shopbar{background:linear-gradient(#161d36,#0d1224);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
.bar2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gold{font-weight:800;color:var(--gold);font-size:16px;padding:0 4px}
.shoprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sc{--tc:#9ca3af;flex:0 0 auto;width:74px;aspect-ratio:3/4;position:relative;border-radius:8px;border:2px solid var(--tc);background:#0b0f1f;overflow:hidden;cursor:pointer;box-shadow:inset 0 -24px 24px -12px color-mix(in srgb,var(--tc) 50%,transparent)}
.sc img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.sc .foot{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000d 45%);padding:12px 4px 3px;display:flex;justify-content:space-between;gap:2px;font-size:10px;font-weight:700;white-space:nowrap}
.sc .foot span:first-child{overflow:hidden;text-overflow:ellipsis}
.sc .cost{color:var(--gold)}
.sc .st{position:absolute;left:3px;top:3px;font-size:10px;background:#000b;border-radius:4px;padding:0 4px}
.sc .emo{display:grid;place-items:center;height:72%;font-size:32px}
.sc.sel{outline:3px solid var(--lime);outline-offset:-3px}
.sc.frozen{box-shadow:inset 0 0 0 3px #7dd3fc}
.sep{flex:0 0 1px;background:var(--line)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--lime);color:#000;font-weight:700;border:0}
#bctl{display:flex;gap:8px;justify-content:center}
#prologue{position:fixed;inset:0;z-index:5;background:radial-gradient(120% 80% at 50% 0%,#23265a 0%,var(--bg) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;overflow:auto}
#prologue h2{font-size:clamp(34px,9vw,64px);margin:0;letter-spacing:-1px;line-height:1}
#prologue p{margin:0;color:var(--dim)}
#prologue .wrap{width:100%;max-width:820px}
#prologue .tag{position:absolute;left:10px;bottom:10px;font-size:11px;color:#000;background:var(--lime);border-radius:4px;padding:1px 6px;font-weight:700}
#prologue .caption{bottom:auto;top:10px}
#plogin{display:flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;font-weight:600;padding:12px 22px;border:0;border-radius:999px;font-size:15px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="prologue">
  <h2>Auto Ping Pong<i>.</i></h2>
  <p>SPP 캐릭터로 팀을 짜고, 경기는 자동으로. 트로피 10개를 모으면 우승!</p>
  <div class="wrap"><canvas id="pboard" class="board"></canvas><div id="pmsg" class="caption"></div><span class="tag">실제 경기 미리보기</span></div>
  <button id="plogin" disabled><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.7 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg><span>불러오는 중…</span></button>
  <p style="font-size:12px">Google로 로그인하면 진행 상황과 기록이 저장돼요</p>
</div>
<main hidden>
  <div class="top"><h1>Auto Ping Pong<i>.</i></h1><span id="stage"></span><button id="login">Google 로그인</button></div>
  <div id="account" class="label"></div>
  <div class="wrap"><canvas id="board" class="board"></canvas><div id="caption" class="caption"></div><div id="traits" class="traits"></div><div id="players"></div></div>
  <div id="info"></div>
  <div id="shopbar">
    <div class="bar2"><span class="gold" id="gold"></span><span id="trophy" class="label"></span><span style="flex:1"></span><button id="roll">새로고침 1</button><button id="freeze">얼리기</button><button id="sell">팔기</button><button id="end" class="go">전투 ▶</button></div>
    <div class="shoprow" id="shop"></div>
  </div>
  <div id="bctl" hidden><button id="skip">건너뛰기</button><button id="speed">×2 속도</button><button id="next" class="go" hidden>다음 턴</button></div>
</main>
<div id="toast"></div>
<script>
const R=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const lvlOf=xp=>xp>=5?3:xp>=2?2:1;
const cap=n=>Math.min(50,n);
const buff=(p,a,h)=>{if(p){p.atk=cap(p.atk+a);p.hp=cap(p.hp+h)}};
const alive=t=>t.filter(p=>p.hp>0);

// 캐릭터 → 펫. 능력은 슈퍼오토펫의 펫 능력을 캐릭터 성격에 맞춰 옮겨 왔다.
const T=(n,t,a,h,d,x={})=>({n,t,a,h,d,...x});
const PETS={
  hugo:T('휴고범',1,2,2,L=>`기절: 랜덤 아군 +${2*L}/+${L}`,{faint(c,L){buff(R(c.mine),2*L,L)}}),
  ajae:T('아재범',1,1,3,L=>`기절: "우기기 아재" ${L}/${L} 소환`,{faint(c,L){summon(c.mine,c.idx,'ajaeT',L,L)}}),
  jongryeong:T('빽종령',1,2,2,L=>`전투 시작: 랜덤 적에게 1 피해 ×${L}`,{start(c,L){for(let i=0;i<L;i++)dmg(R(alive(c.foe)),1,c.me)}}),
  ttalgak:T('날먹세',1,2,1,L=>`판매: 골드 +${L} 추가`,{sell(S,me,L){S.gold+=L}}),
  seohyun:T('일병3호봉',2,3,1,L=>`기절: 뒤 아군 2명 +${L}/+${L}`,{f:'private-four',faint(c,L){c.mine.slice(c.idx,c.idx+2).forEach(f=>buff(f,L,L))}}),
  drunk:T('만취범',2,3,2,L=>`기절: 모든 펫에게 ${2*L} 피해`,{faint(c,L){[...c.mine,...c.foe].forEach(p=>dmg(p,2*L,c.me))}}),
  songstar:T('송스타',2,2,4,L=>`피격 후 생존: 공격 +${2*L}`,{hurt(c,L){if(c.me.hp>0)c.me.atk=cap(c.me.atk+2*L)}}),
  kumho:T('금호관장',3,1,5,L=>`기절: 뒤 아군 ${L}명에게 멜론(피해 -20) 지급`,{faint(c,L){c.mine.slice(c.idx,c.idx+L).forEach(f=>f.perk='melon')}}),
  percival:T('퍼시벌',3,2,3,L=>`앞 아군이 공격할 때: +${L}/+${L}`,{ahead(c,L){buff(c.me,L,L)}}),
  yunhwan:T('카사노바 윤',3,3,3,L=>`피격: 랜덤 적에게 ${2*L} 피해`,{hurt(c,L){dmg(R(alive(c.foe)),2*L,c.me)}}),
  jiseong:T('김치성',3,2,3,L=>`기절: "역전 치성" ${2*L}/${2*L} 두 명 소환`,{faint(c,L){summon(c.mine,c.idx,'chiT',2*L,2*L);summon(c.mine,c.idx,'chiT',2*L,2*L)}}),
  leesin:T('리신범',4,4,3,L=>`전투 시작: 체력이 가장 낮은 적에게 ${4*L} 피해`,{start(c,L){const a=alive(c.foe);if(a.length)dmg(a.reduce((m,p)=>p.hp<m.hp?p:m),4*L,c.me)}}),
  adam:T('아담 성',4,3,5,L=>`턴 종료: Lv2 이상 다른 아군 2명 +${L}/+${L}`,{endTurn(S,me,L){shuffle(S.team.filter(p=>p&&p!==me&&lvlOf(p.xp)>=2)).slice(0,2).forEach(p=>buff(p,L,L))}}),
  sleepy:T('졸린 지킬',4,4,5,L=>`적 처치: +${2*L}/+${2*L}`,{kill(c,L){buff(c.me,2*L,2*L)}}),
  aribeom:T('매혹범',4,3,4,L=>`전투 시작: 공격력이 가장 높은 적 공격 -${2*L}`,{start(c,L){const a=alive(c.foe);if(a.length){const t=a.reduce((m,p)=>p.atk>m.atk?p:m);t.atk=Math.max(1,t.atk-2*L)}}}),
  hyde:T('하이드',5,4,4,L=>`아군 기절: +${2*L}/+${L}`,{friendFaint(c,L){buff(c.me,2*L,L)}}),
  godyung:T('갓융자',5,6,3,L=>`적 처치: 맨 앞 적에게 ${4*L} 피해`,{kill(c,L){dmg(alive(c.foe)[0],4*L,c.me)}}),
  gambler:T('올인 도박사',5,5,5,L=>`전투 시작: ${40+10*L}% 확률로 공·체 2배, 실패하면 절반`,{start(c,L){const p=c.me;if(Math.random()<.4+.1*L){p.atk=cap(p.atk*2);p.hp=cap(p.hp*2)}else{p.atk=Math.ceil(p.atk/2);p.hp=Math.ceil(p.hp/2)}}}),
  ninja:T('맹타치',5,5,4,L=>`전투 시작: 맨 뒤 적에게 ${5*L} 피해`,{start(c,L){const a=alive(c.foe);dmg(a[a.length-1],5*L,c.me)}}),
  jh:T('지킬앤 하이범',6,6,7,L=>`전투 시작: 랜덤 적에게 공격력 절반 피해 ×${L}`,{f:'jekyll-hyde',start(c,L){for(let i=0;i<L;i++)dmg(R(alive(c.foe)),Math.ceil(c.me.atk/2),c.me)}}),
  pastor:T('허허 목사',6,4,8,L=>`기절: 모든 아군 +${2*L}/+${2*L}`,{faint(c,L){c.mine.forEach(f=>buff(f,2*L,2*L))}}),
  infibot:T('무한 리턴 봇',2,1,4,L=>`피격 후 생존: 멜론 획득 (전투당 ${L}회)`,{hurt(c,L){const p=c.me;if(p.hp>0&&p.uses<L){p.uses++;p.perk='melon'}}}),
  boss:T('탁구 마왕',6,7,7,L=>`턴 종료: 다른 아군 모두 +${L}/+${L}`,{endTurn(S,me,L){S.team.forEach(p=>p&&p!==me&&buff(p,L,L))}}),
  minhee:T('민희쌤',6,5,6,L=>`턴 종료: 랜덤 다른 아군 ${L}명 경험치 +1 (레슨)`,{endTurn(S,me,L){shuffle(S.team.filter(p=>p&&p!==me&&p.xp<5)).slice(0,L).forEach(p=>{buff(p,1,1);gainXp(S,p,1)})}}),
  ajaeT:T('우기기 아재',0,1,1,()=>'',{f:'ajae'}),
  chiT:T('역전 치성',0,2,2,()=>'',{f:'jiseong'}),
  bee:T('꿀벌',0,1,1,()=>'',{f:null}),
};
const FOODS={
  apple:{n:'사과',e:'🍎',t:1,d:'+1/+1',use(S,p){buff(p,1,1)}},
  honey:{n:'꿀',e:'🍯',t:1,d:'기절하면 1/1 꿀벌 소환',perk:1},
  choco:{n:'초콜릿',e:'🍫',t:2,d:'+1/+1, 경험치 +1',use(S,p){buff(p,1,1);gainXp(S,p,1)}},
  meat:{n:'고기뼈',e:'🍖',t:2,d:'공격 피해 +3',perk:1},
  garlic:{n:'마늘',e:'🧄',t:3,d:'받는 피해 -2 (최소 1)',perk:1},
  salad:{n:'샐러드',e:'🥗',t:3,d:'랜덤 아군 2명 +1/+1',all:[2,1]},
  sushi:{n:'초밥',e:'🍣',t:4,d:'랜덤 아군 3명 +1/+1',all:[3,1]},
  melon:{n:'멜론',e:'🍈',t:5,d:'받는 피해 -20 (1회)',perk:1},
  pizza:{n:'피자',e:'🍕',t:6,d:'랜덤 아군 2명 +2/+2',all:[2,2]},
  steak:{n:'스테이크',e:'🥩',t:6,d:'다음 공격 피해 +20 (1회)',perk:1},
};

// 필살기: SPP의 필살기를 캐릭터마다 하나씩. 기본 공격(+35)과 피격(+10)으로 게이지가 차고, 100이 되면 시전한다.
// t = 계열(효과), fx = 이펙트, c = 색
const ULTS={
  blitz:{n:'카운터 블리츠',t:'lightning',fx:'electric',c:'#78dcff'},phantasm:{n:'환영 페이크',t:'phantom',fx:'bubble',c:'#be96ff'},
  wall:{n:'철벽 카운터',t:'lightning',fx:'spark',c:'#b4bed2'},flick:{n:'선제 플릭',t:'chiquita',fx:'glyph:★',c:'#ffb450'},
  sunflare:{n:'태양 플레어',t:'loop',fx:'fire',c:'#ffc83c'},blast:{n:'폭렬 드라이브',t:'loop',fx:'fire',c:'#ff6e28'},
  aegis:{n:'이지스 커트',t:'chop',fx:'slash',c:'#e6e6ff'},typhoon:{n:'태풍의 눈',t:'loop',fx:'vortex',c:'#78dcff'},
  starfall:{n:'별똥별',t:'crescent',fx:'glyph:★',c:'#fff096'},radiant:{n:'빛의 반격',t:'crescent',fx:'holy',c:'#fffab4'},
  magnet:{n:'흡수 커트',t:'chop',fx:'shock',c:'#aa78ff'},phoenixc:{n:'불사조 반격',t:'loop',fx:'fire',c:'#ff6428'},
  dragon:{n:'용오름 루프',t:'loop',fx:'vortex',c:'#50dc8c'},drill:{n:'드릴 스핀',t:'loop',fx:'vortex',c:'#ffaa3c'},
  lunar:{n:'월광 스톱',t:'phantom',fx:'glyph:☾',c:'#c8d2ff'},sakura:{n:'벚꽃 난무',t:'crescent',fx:'glyph:✿',c:'#ffaac8'},
  shadowc:{n:'그림자 카운터',t:'crescent',fx:'dark',c:'#8c50c8'},mirage:{n:'신기루',t:'phantom',fx:'bubble',c:'#ffdcaa'},
  comet:{n:'혜성 드라이브',t:'crescent',fx:'fire',c:'#a08cff'},blade:{n:'장검 찌르기',t:'lightning',fx:'slash',c:'#c8c8ff'},
  eclipse:{n:'일식 드라이브',t:'crescent',fx:'glyph:☾',c:'#7864dc'},heaven:{n:'천상의 일섬',t:'lightning',fx:'holy',c:'#fff5c8'},
  hammer:{n:'천벌 해머',t:'thunder',fx:'shock',c:'#ffdc78'},meteor:{n:'메테오 스매시',t:'thunder',fx:'fire',c:'#ff7828'},
};
const ULT_OF={hugo:'blitz',ajae:'phantasm',jongryeong:'wall',ttalgak:'flick',seohyun:'sunflare',drunk:'blast',songstar:'aegis',infibot:'typhoon',
  kumho:'starfall',percival:'radiant',yunhwan:'magnet',jiseong:'phoenixc',leesin:'dragon',adam:'drill',sleepy:'lunar',aribeom:'sakura',
  hyde:'shadowc',godyung:'mirage',gambler:'comet',ninja:'blade',jh:'eclipse',pastor:'heaven',boss:'hammer',minhee:'meteor'};
const ULT_DESC={loop:'맨 앞 적에게 공격력 ×2 피해',lightning:'맨 앞 적에게 공격력 ×1.5, 그 뒤 적에게 절반 피해',thunder:'모든 적에게 공격력 절반 피해',
  crescent:'맨 뒤 적에게 공격력 ×1.5 피해',phantom:'맨 앞 적의 공격력을 절반으로 낮추고 공격력 절반 피해',
  chop:'맨 앞 적에게 공격력만큼 피해, 자신은 멜론 획득',chiquita:'랜덤 적에게 공격력 절반 피해 ×3'};
const ultOf=key=>ULTS[ULT_OF[key]];

// 시너지 (롤토체스식): 서로 다른 캐릭터 수로 세고, th 인원에 닿으면 단계가 켜진다. d = 단계별 효과
const TRAITS={
  atk:{n:'공격수',c:'#f97316',th:[2,4],d:['아군 전체 공격 +2','아군 전체 공격 +5']},
  def:{n:'수비수',c:'#38bdf8',th:[2,4],d:['아군 전체 받는 피해 -1','아군 전체 받는 피해 -2']},
  vet:{n:'동호회 아재',c:'#a3e635',th:[2,4],d:['아군 전체 체력 +3','아군 전체 체력 +7']},
  tech:{n:'테크니션',c:'#c084fc',th:[2,3],d:['필살기 게이지 40으로 시작','필살기 게이지 80으로 시작']},
  dual:{n:'이중인격',c:'#f43f5e',th:[2,3],d:['아군이 쓰러질 때마다 이중인격 아군 공격 +2','아군이 쓰러질 때마다 이중인격 아군 공격 +4']},
  boss:{n:'보스',c:'#facc15',th:[2,3],d:['전투 시작: 모든 적에게 2 피해','전투 시작: 모든 적에게 4 피해']},
  comeback:{n:'역전',c:'#2dd4bf',th:[2,3],d:['역전 아군이 쓰러지면 남은 아군 +2/+2','역전 아군이 쓰러지면 남은 아군 +4/+4']},
};
const TRAIT_OF={hugo:['atk'],ajae:['vet'],jongryeong:['def','vet'],ttalgak:['tech'],seohyun:['atk'],drunk:['vet','comeback'],songstar:['def'],
  infibot:['def'],kumho:['def','vet'],percival:['atk'],yunhwan:['def'],jiseong:['comeback'],leesin:['atk'],adam:['tech'],sleepy:['dual'],
  aribeom:['boss','tech'],hyde:['dual'],godyung:['boss','tech'],gambler:['atk','comeback'],ninja:['tech'],jh:['dual'],pastor:['vet'],boss:['boss'],minhee:['boss','atk']};
const hasTrait=(key,t)=>(TRAIT_OF[key]||[]).includes(t);
function traitCounts(team){const seen=new Set(),c={};for(const p of team)if(p&&!seen.has(p.key)){seen.add(p.key);(TRAIT_OF[p.key]||[]).forEach(t=>c[t]=(c[t]||0)+1)}return c}
const traitLv=(t,n)=>TRAITS[t].th.filter(x=>n>=x).length;   // 0 = 꺼짐, 1, 2

// ---------- 상점 (플레이어와 봇이 같은 규칙을 쓴다) ----------
let uid=0;
const mk=(key,atk=PETS[key].a,hp=PETS[key].h)=>({uid:++uid,key,atk,hp,xp:0,perk:null});
const maxTier=S=>Math.min(6,Math.ceil(S.turn/2));
const petSlots=S=>S.turn>=9?5:S.turn>=5?4:3;
const foodSlots=S=>S.turn>=3?2:1;
const pickPet=(lo,hi)=>R(Object.keys(PETS).filter(k=>PETS[k].t>=lo&&PETS[k].t<=hi));
const pickFood=hi=>R(Object.keys(FOODS).filter(k=>FOODS[k].t<=hi));
const shopPet=key=>({key,atk:PETS[key].a,hp:PETS[key].h,frozen:false});

function newState(human){return{human,turn:0,gold:10,lives:5,wins:0,team:[null,null,null,null,null],shop:{pets:[],food:[]}}}
function roll(S){
  const sp=S.shop;
  sp.pets=sp.pets.filter(x=>x.frozen);sp.food=sp.food.filter(x=>x.frozen);
  while(sp.pets.length<petSlots(S))sp.pets.push(shopPet(pickPet(1,maxTier(S))));
  while(sp.food.length<foodSlots(S))sp.food.push({key:pickFood(maxTier(S)),frozen:false});
}
function gainXp(S,p,n){
  const before=lvlOf(p.xp);p.xp=Math.min(5,p.xp+n);
  if(lvlOf(p.xp)>before){
    const t=Math.min(6,maxTier(S)+1);
    S.shop.pets.push(shopPet(pickPet(t,t)));
    if(S.human)toast(`${PETS[p.key].n} Lv${lvlOf(p.xp)}! 상점에 ${t}티어 보너스 펫`);
  }
}
function merge(S,t,src){t.atk=cap(Math.max(t.atk,src.atk)+1);t.hp=cap(Math.max(t.hp,src.hp)+1);gainXp(S,t,src.xp+1)}
function buyPet(S,i,slot){
  const it=S.shop.pets[i],t=S.team[slot];
  if(S.gold<3)return'골드가 부족해요';
  if(t&&(t.key!==it.key||t.xp>=5))return'같은 캐릭터끼리만 합칠 수 있어요';
  S.gold-=3;S.shop.pets.splice(i,1);
  const p=mk(it.key,it.atk,it.hp);
  if(t)merge(S,t,p);else S.team[slot]=p;
}
function buyFood(S,i,p){
  if(S.gold<3)return'골드가 부족해요';
  const f=FOODS[S.shop.food[i].key];
  if(!p&&!f.all)return'음식을 줄 펫을 고르세요';
  if(!S.team.some(Boolean))return'팀에 펫이 없어요';
  S.gold-=3;S.shop.food.splice(i,1);
  if(f.all)shuffle(S.team.filter(Boolean)).slice(0,f.all[0]).forEach(x=>buff(x,f.all[1],f.all[1]));
  else if(f.perk)p.perk=Object.keys(FOODS).find(k=>FOODS[k]===f);
  else f.use(S,p);
}
function sell(S,slot){const p=S.team[slot];S.team[slot]=null;S.gold+=lvlOf(p.xp);PETS[p.key].sell?.(S,p,lvlOf(p.xp))}
function reroll(S){if(S.gold<1)return'골드가 부족해요';S.gold--;roll(S)}
function startTurn(S){S.turn++;S.gold=10;roll(S);S.team.forEach(p=>p&&PETS[p.key].startTurn?.(S,p,lvlOf(p.xp)))}
function endTurn(S){S.team.forEach(p=>p&&PETS[p.key].endTurn?.(S,p,lvlOf(p.xp)))}

// ponytail: 탐욕적인 봇 (합성 > 빈칸 채우기 > 상위 티어로 교체 > 음식 > 리롤). 실제 게임처럼 다른 유저 팀이 필요하면 Firebase에 팀을 저장해 불러오면 된다.
const score=p=>PETS[p.key].t*10+p.atk+p.hp;
function botPlay(S){
  for(let g=0;g<40;g++){
    const team=S.team,sp=S.shop.pets,empty=team.indexOf(null);
    if(S.gold>=3){
      const mi=sp.findIndex(x=>team.some(p=>p&&p.key===x.key&&p.xp<5));
      if(mi>=0){buyPet(S,mi,team.findIndex(p=>p&&p.key===sp[mi].key&&p.xp<5));continue}
      const best=sp.map((x,i)=>[PETS[x.key].t+Math.random(),i]).sort((a,b)=>b[0]-a[0])[0];
      if(best&&empty>=0){buyPet(S,best[1],empty);continue}
      if(best){const weak=team.reduce((m,p)=>score(p)<score(m)?p:m);if(PETS[sp[best[1]].key].t>PETS[weak.key].t){sell(S,team.indexOf(weak));continue}}
      if(S.shop.food.length&&team.some(Boolean)){buyFood(S,0,R(team.filter(Boolean)));continue}
    }
    if(S.gold>=4){reroll(S);continue}
    break;
  }
}

// ---------- 전투 ----------
let B;
const P=p=>PETS[p.key];
const ctx=p=>{const mine=B.A.includes(p)?B.A:B.B;return{me:p,mine,foe:mine===B.A?B.B:B.A}};
function dmg(t,n,src){
  if(!t||t.hp<=0||n<=0)return;
  if(t.dr)n=Math.max(1,n-t.dr);
  if(t.perk==='garlic')n=Math.max(1,n-2);
  if(t.perk==='melon'){n=Math.max(0,n-20);t.perk=null}
  B.ev.push({s:src?.uid,t:t.uid,n});
  if(n<=0)return;
  t.hp-=n;B.q.push(t);
  if(t.hp>0)t.mp=Math.min(100,(t.mp||0)+10);
  if(t.hp<=0)t.killer=src;
}
function summon(side,i,key,a,h){if(side.length<5)side.splice(Math.min(i,side.length),0,{...mk(key,a,h),L:1,uses:0,mx:h,mp:0})}
function snap(msg,kind=''){const c=t=>t.map(p=>({uid:p.uid,key:p.key,atk:p.atk,hp:Math.max(0,p.hp),mx:p.mx,mp:p.mp,perk:p.perk,L:p.L}));B.frames.push({A:c(B.A),B:c(B.B),msg,kind,ev:B.ev});B.ev=[]}
function resolve(){
  for(let g=0;g<300;g++){
    if(B.q.length){const t=B.q.shift();P(t).hurt?.(ctx(t),t.L);continue}
    let side=B.A.some(p=>p.hp<=0)?B.A:B.B.some(p=>p.hp<=0)?B.B:null;
    if(!side)return;
    const i=side.findIndex(p=>p.hp<=0),dead=side[i];
    const c={me:dead,mine:side,foe:side===B.A?B.B:B.A,idx:i};
    side.splice(i,1);
    P(dead).faint?.(c,dead.L);
    if(dead.perk==='honey')summon(side,i,'bee',1,1);
    [...side].forEach(f=>P(f).friendFaint?.(ctx(f),f.L));
    const tl=side.tl||{};
    if(tl.dual)side.forEach(f=>{if(hasTrait(f.key,'dual'))f.atk=cap(f.atk+2*tl.dual)});
    if(tl.comeback&&hasTrait(dead.key,'comeback'))side.forEach(f=>buff(f,2*tl.comeback,2*tl.comeback));
    const k=dead.killer;if(k&&k.hp>0)P(k).kill?.(ctx(k),k.L);
    snap(`${P(dead).n} 기절`);
  }
}
function castUlt(p){
  const c=ctx(p),A=p.atk,f=()=>alive(c.foe),half=Math.max(1,Math.ceil(A/2));
  switch(ultOf(p.key).t){
    case 'loop':dmg(f()[0],A*2,p);break;
    case 'lightning':{const a=f();dmg(a[0],Math.ceil(A*1.5),p);dmg(a[1],half,p);break}
    case 'thunder':f().forEach(e=>dmg(e,half,p));break;
    case 'crescent':{const a=f();dmg(a[a.length-1],Math.ceil(A*1.5),p);break}
    case 'phantom':{const e=f()[0];if(e){e.atk=Math.max(1,Math.ceil(e.atk/2));dmg(e,half,p)}break}
    case 'chop':dmg(f()[0],A,p);p.perk='melon';break;
    case 'chiquita':for(let i=0;i<3;i++)dmg(R(f()),half,p);break;
  }
}
function attackPower(p){let d=p.atk;if(p.perk==='meat')d+=3;if(p.perk==='steak'){d+=20;p.perk=null}return d}
function battle(ta,tb){
  const cl=p=>({...p,L:lvlOf(p.xp),uses:0,mx:p.hp,mp:0});
  B={A:ta.filter(Boolean).map(cl),B:tb.filter(Boolean).map(cl),q:[],frames:[],ev:[]};
  for(const [side,src] of [[B.A,ta],[B.B,tb]]){   // 시너지 적용
    const c=traitCounts(src);side.tl={};for(const t in TRAITS)side.tl[t]=traitLv(t,c[t]||0);
    side.forEach(p=>{p.atk=cap(p.atk+[0,2,5][side.tl.atk]);p.hp=cap(p.hp+[0,3,7][side.tl.vet]);p.mx=p.hp;p.dr=[0,1,2][side.tl.def];p.mp=[0,40,80][side.tl.tech]});
  }
  snap('전투 시작!');
  for(const [side,foe] of [[B.A,B.B],[B.B,B.A]])if(side.tl.boss){foe.forEach(e=>dmg(e,2*side.tl.boss,null));snap(`시너지 · 보스 ${side===B.A?'(내 팀)':'(상대)'}`)}
  for(const p of [...B.A,...B.B].sort((x,y)=>y.atk-x.atk))if(p.hp>0&&P(p).start){P(p).start(ctx(p),p.L);snap(`${P(p).n}: ${P(p).d(p.L)}`)}
  resolve();
  for(let n=0;B.A.length&&B.B.length&&n<100;n++){
    for(const s of [B.A,B.B])if(s[1])P(s[1]).ahead?.(ctx(s[1]),s[1].L);
    const a=B.A[0],b=B.B[0],da=attackPower(a),db=attackPower(b);
    dmg(b,da,a);dmg(a,db,b);
    for(const p of [a,b])if(p.hp>0)p.mp=Math.min(100,(p.mp||0)+35);
    snap(`${P(a).n} ⚔ ${P(b).n}`,'attack');
    resolve();
    for(const s of [B.A,B.B])for(const p of [...s])if(p.hp>0&&p.mp>=100&&ultOf(p.key)){p.mp=0;castUlt(p);snap(`${P(p).n} 필살기 · ${ultOf(p.key).n}`,'ult');resolve()}
  }
  const r=B.A.length&&!B.B.length?'win':!B.A.length&&B.B.length?'lose':'draw';
  return{frames:B.frames,r};
}

// ---------- 보드 (롤토체스식 육각 보드 위에서 탁구채를 든 캐릭터가 싸운다) ----------
const $=id=>document.getElementById(id);
const TC=['#6b7280','#9ca3af','#22c55e','#3b82f6','#a855f7','#f59e0b','#ef4444'];   // 티어 색 (0 = 소환물)
const IMG={};
function faceOf(key){const d=PETS[key],f=d.f===undefined?key:d.f;return f&&(IMG[f]||(IMG[f]=Object.assign(new Image(),{src:`faces/${f}-face.png`})))}
const SLOT=[[0,2],[0,1],[0,3],[1,1],[1,2]];   // 팀 순서 → [앞에서 몇째 줄, 칸]. 0번이 맨 앞 (한 팀 2줄 × 5칸)
// 캐릭터별 전투 스타일. hit = 때리는 방식, fx = 맞았을 때 이펙트, mv = 움직이는 방식, pose = 자세, c = 기 색깔

const styleOf=k=>STYLE[k]||{c:'#cbd5e1',hit:'drive',fx:'spark',mv:'walk'};
const RANGED={serve:'ball',lob:'lob',laser:'laser',charm:'heart',cards:'card',holy:'holy'};
const REACH={drive:.55,smash:.65,chop:.42,block:.3,spin:.58,dash:.85,kick:.75,drunk:.6,boss:.72};
const clamp=v=>v<0?0:v>1?1:v,ease=t=>1-(1-t)*(1-t)*(1-t),lerp=(a,b,t)=>a+(b-a)*t;
const angLerp=(a,b,t)=>{let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t};

function makeArena(cv){
  const g=cv.getContext('2d'),U=new Map();
  let banner=null,W=0,H=0,parts=[],proj=[],fx=[],fl=[],frames=[],fi=-1,t0=0,Dk=800,D=800,raf=0,last=0,onDone=null,cap=null,still=false,selSlot=-1;
  const cam={shA:0,shU:0,flC:'#fff',flA:0,flU:0,flD:1,zx:0,zy:0,zA:0,zT:0,zD:1};
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(r.width&&(r.width!==W||r.height!==H)){W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}}
  function tile(c,r){const top=H*.22,bot=H*.99,rh=(bot-top)/4,p=.84+.16*r/3,w=Math.min(W*.92/5.6,rh*1.25)*p;return{x:W/2+(c-2+(r%2?.25:-.25))*w,y:top+(r+.5)*rh,w}}
  const pos=(side,i)=>{const[dr,c]=SLOT[Math.min(i,4)];return tile(c,side==='A'?2+dr:1-dr)};
  const spawn=o=>{if(parts.length<700)parts.push({born:performance.now(),g:0,drag:1,...o})};
  function shake(a,ms){if(reduced)return;cam.shA=Math.max(cam.shA,a);cam.shU=performance.now()+ms}
  function flash(c,a,ms){cam.flC=c;cam.flA=a;cam.flD=ms;cam.flU=performance.now()+ms}
  function zoom(x,y,a,ms){if(reduced)return;Object.assign(cam,{zx:x,zy:y,zA:a,zT:performance.now(),zD:ms})}

  // ----- 유닛 상태 -----
  function upsert(side,i,p,now){
    let u=U.get(p.uid);
    if(!u){const P=pos(side,i);u={uid:p.uid,key:p.key,side,x:P.x,y:P.y,w:P.w,hp:p.hp,atk:p.atk,mx:p.mx||p.hp,L:p.L||1,perk:p.perk,born:now,dieT:0,flash:-1e9,act:null,S:styleOf(p.key)};U.set(p.uid,u)}
    u.idx=i;u.next=p;return u;
  }
  function float(u,text,color,size=1){fl.push({x:u.x,y:u.y-u.w*1.6,text,color,size,t:performance.now()})}
  function apply(u,p,now,show){
    const da=p.atk-u.atk,dh=p.hp-u.hp;
    if(show&&(da||dh)&&p.hp>0){float(u,`${da<0?'':'+'}${da}/${dh<0?'':'+'}${dh}`,'#4ade80',.85);if(da>0||dh>0)buffFx(u)}
    Object.assign(u,{hp:p.hp,atk:p.atk,L:p.L||u.L,perk:p.perk,mp:p.mp});u.mx=Math.max(u.mx,p.mx||0,p.hp);
    if(p.hp<=0&&!u.dieT)u.dieT=now;
  }
  function buffFx(u){for(let i=0;i<10;i++)spawn({kind:'dot',x:u.x+(Math.random()-.5)*u.w,y:u.y-Math.random()*u.w,vx:0,vy:-60-Math.random()*60,life:700,col:'#4ade80',sz:3})}
  function hit(e,now){
    if(e.done)return;e.done=true;const t=e.t;if(!t)return;
    const s=e.s,L=s?s.L:1,S=s?s.S:{c:'#c084fc',fx:'spark'},k=t.w*1.05;
    apply(t,t.next,now,false);t.flash=now;
    if(t.hp<=0){t.killL=L;t.killA=s?Math.atan2(t.y-s.y,t.x-s.x):0}
    const fa=s?Math.atan2(t.y-s.y,t.x-s.x):Math.PI/2;
    if(e.ult)impact(e.ult.fx,t.x,t.y-k*.65,e.ult.c,Math.max(3,L),fa,k);else impact(S.fx,t.x,t.y-k*.65,S.c,L,fa,k);
    float(t,e.n>0?`-${e.n}`:'막음',e.n>0?(e.ult?e.ult.c:L>=3?'#fde047':L>=2?S.c:'#fff'):'#93c5fd',e.ult?2:1.15+.35*(L-1));
  }
  function flush(now){fx.forEach(e=>hit(e,now));fx=[]}
  function enter(k,now){
    flush(now);fi=k;t0=now;
    const f=frames[k],seen=new Set(),hitIds=new Set(f.ev.map(e=>e.t)),melee=f.kind==='attack';
    for(const side of ['A','B'])f[side].forEach((p,i)=>{seen.add(p.uid);const u=upsert(side,i,p,now);if(!hitIds.has(p.uid))apply(u,p,now,k>0)});
    for(const id of [...U.keys()])if(!seen.has(id))U.delete(id);
    const srcL=Math.max(1,...f.ev.map(e=>U.get(e.s)?.L||1));
    const ultF=f.kind==='ult',ult=ultF&&f.ev.length?ultOf(U.get(f.ev[0].s)?.key):null;

  // ----- 자세와 동작 -----
  function actPose(u,now,lag=0){
    const P={ox:0,oy:0,sc:1,rot:0,arm:null,charge:0,kick:0,alpha:1,top:false,striking:0};
    const a=u.act;if(!a)return P;

    const c=clamp(p/.35),s=clamp((p-.35)/(a.imp-.35)),r=clamp((p-a.imp)/(1-a.imp));

    P.charge=c*(1-s);P.striking=s>0&&s<1?1:0;

    if(a.type==='ult'){const up=clamp(p/.45);P.charge=up*(1-r);P.sc=1+.3*Math.sin(up*Math.PI/2)*(1-r);P.oy=-u.w*.35*up*(1-r);P.arm=s<=0?angLerp(.9,-Math.PI/2,ease(up)):angLerp(-Math.PI/2,thru,ease(clamp((p-.45)/.15)));P.striking=s>0&&s<1?1:0;P.ult=1;return P}

      if(type==='smash'||type==='boss'){P.oy-=Math.sin(s*Math.PI)*u.w*(type==='boss'?2:1.3);P.crouch=c*.25}
      if(type==='kick'){P.oy-=Math.sin(s*Math.PI)*u.w*.7;P.kick=s>0&&r<1?fa:0}
      if(type==='spin')P.rot=s*Math.PI*2*(u.L>=3?2:1);
      if(type==='drunk')P.rot=Math.sin(now/55)*.45*(s||c);
      if(type==='dash'){P.alpha=s>0&&s<.5?1-s*2:s>=.5&&r<.6?1:r>=.6?Math.max(.2,1-(r-.6)*2):1}
      if(u.L>=3&&type!=='dash'&&s>0&&r<=0){   // 3성: 화면 밖(카메라 쪽)으로 솟구쳤다가 내리꽂힌다
        const cx=W/2-u.x,cy=H*.9-u.y;
        if(s<.55){const q=ease(s/.55);P.ox=cx*q;P.oy=cy*q-u.w*Math.sin(q*Math.PI);P.sc=1+1.8*q}
        else{const q=(s-.55)/.45;P.ox=lerp(cx,dx*.72,q);P.oy=lerp(cy,dy*.72,q);P.sc=lerp(2.8,1.3,q)}

      }
      if(u.L>=3&&r>0){P.sc=lerp(1.3,1,r)}

    return P;
  }

  }

  function drawParts(now,dt){

  function ambient(u,now){   // 2성 이상: 반짝이는 입자가 계속 피어오른다. 기를 모을 때는 주변에서 빨려 들어온다

    if(u.L>=2&&Math.random()<(u.L>=3?.5:.15))spawn({kind:'dot',x:u.x+(Math.random()-.5)*k*.7,y:u.y-Math.random()*k*.4,vx:0,vy:-40-Math.random()*70,life:700,col:u.L>=3?'#fde047':u.S.c,sz:1.5+Math.random()*2});
    if(P.charge>.05&&u.L>=2){const a=Math.random()*7,R=k*(1.1+u.L*.3);spawn({kind:'dot',x:u.x+Math.cos(a)*R,y:u.y-k*.6+Math.sin(a)*R*.7,vx:-Math.cos(a)*R*2.4,vy:-Math.sin(a)*R*1.7,life:400,col:u.S.c,sz:2+u.L*.6})}
    if(u.L>=3&&Math.random()<.05)spawn({kind:'bolt',x:u.x+(Math.random()-.5)*k*.6,y:u.y-k*(.3+Math.random()*.8),x2:u.x+(Math.random()-.5)*k*1.1,y2:u.y-k*(.2+Math.random()*1.1),life:120,col:'#fef08a'});
    if(u.act?.type==='kick'&&P.kick)spawn({kind:'dot',x:u.x+P.ox,y:u.y+P.oy-k*.3,vx:0,vy:-30,life:300,col:'#f97316',sz:4});
  }
  function draw(now,dt){
    g.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);g.clearRect(0,0,W,H);
    g.save();
    if(now<cam.shU){const a=cam.shA*(cam.shU-now)/400;g.translate((Math.random()-.5)*a,(Math.random()-.5)*a)}else cam.shA=0;
    const zq=(now-cam.zT)/cam.zD;if(zq>=0&&zq<1){const z=1+cam.zA*Math.sin(zq*Math.PI);g.translate(cam.zx,cam.zy);g.scale(z,z);g.translate(-cam.zx,-cam.zy)}
    for(let r=0;r<4;r++)for(let c=0;c<5;c++){const t=tile(c,r);hexPath(t.x,t.y,t.w*.53);g.fillStyle=r<2?'rgba(239,68,68,.06)':'rgba(59,130,246,.09)';g.fill();g.lineWidth=1;g.strokeStyle=r<2?'rgba(248,113,113,.22)':'rgba(96,165,250,.3)';g.stroke()}
    if(still){
      for(let j=0;j<5;j++){const t=pos('A',j);hexPath(t.x,t.y,t.w*.5);g.fillStyle=j===selSlot?'rgba(200,241,105,.4)':'rgba(200,241,105,.1)';g.fill();g.strokeStyle='rgba(200,241,105,.55)';g.stroke()}
      const t=pos('A',0);g.font='700 11px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#c8f169';if(![...U.values()].some(u=>u.idx===0))g.fillText('맨 앞',t.x,t.y);
    }
    const dim=Math.max(0,...[...U.values()].map(u=>(u.L>=3||u.act?.type==='ult')&&u.act?actPose(u,now).charge:0));   // 3성이 기를 모으면 화면이 어두워진다
    if(dim>0){g.fillStyle=`rgba(3,4,12,${dim*.5})`;g.fillRect(-W,-H,W*3,H*3)}

    list.sort((a,b)=>(actPose(a,now).top-actPose(b,now).top)||a.y-b.y).forEach(u=>drawUnit(u,now));

      g.lineWidth=3.5;g.strokeStyle='#000';g.strokeText(f.text,f.x,f.y-p*40);g.fillStyle=f.color;g.fillText(f.text,f.x,f.y-p*40);g.globalAlpha=1}

      g.save();g.globalAlpha=al;g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,H*.42-fs*.75,W,fs*1.5);
      g.font=`900 ${fs}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=6;g.strokeStyle='#000';g.strokeText(banner.text,W/2,H*.42);
      g.shadowColor=banner.col;g.shadowBlur=24;g.fillStyle=banner.col;g.fillText(banner.text,W/2,H*.42);

  function loop(now){

    const dt=Math.min(.05,(now-(last||now))/1000);last=now;
    if(frames.length){
      if(fi<0)enter(0,now);
      else if(now-t0>Dk){if(fi<frames.length-1)enter(fi+1,now);else if(onDone){flush(now);const d=onDone;onDone=null;d()}}
    }
    for(const e of fx)if(now>=e.hit)hit(e,now);
    fx=fx.filter(e=>!e.done);

}

// ---------- 화면 ----------
let me,bot,foeName,sel=null,mode='shop',fast=false;
const board=makeArena($('board')),pboard=makeArena($('pboard'));
const isSel=(src,i)=>sel&&sel.src===src&&sel.i===i?'sel':'';
function render(){
  $('stage').textContent=`라운드 ${me.turn}`;

let tt;function toast(m){$('toast').textContent=m;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),1800)}
function fail(m){if(m)toast(m);return m}
function teamClick(j){
  const t=me.team[j];
  if(sel?.src==='pet'){if(!fail(buyPet(me,sel.i,j)))sel=null}
  else if(sel?.src==='food'){if(!fail(buyFood(me,sel.i,t)))sel=null}
  else if(sel?.src==='team'){
    const a=me.team[sel.i];
    if(sel.i!==j){if(t&&t.key===a.key&&t.xp<5){merge(me,t,a);me.team[sel.i]=null}else{me.team[sel.i]=t;me.team[j]=a}}
    sel=null;
  }else if(t)sel={src:'team',i:j};
}
document.addEventListener('click',e=>{
  if(mode!=='shop')return;
  if(e.target.id==='board'){const r=e.target.getBoundingClientRect(),j=board.slotAt(e.clientX-r.left,e.clientY-r.top);if(j>=0)teamClick(j);else sel=null;return render()}
  const el=e.target.closest('[data-pet],[data-food]');if(!el)return;
  if(el.dataset.pet!=null){const i=+el.dataset.pet;sel=isSel('pet',i)?null:{src:'pet',i}}
  else{const i=+el.dataset.food;sel=isSel('food',i)?null:{src:'food',i}}
  render();
});
$('roll').onclick=()=>{fail(reroll(me));sel=sel?.src==='team'?sel:null;render()};
$('freeze').onclick=()=>{const it=(sel.src==='pet'?me.shop.pets:me.shop.food)[sel.i];it.frozen=!it.frozen;render()};
$('sell').onclick=()=>{sell(me,sel.i);sel=null;render()};
$('speed').onclick=()=>{fast=!fast;board.speed(fast?2:1);$('speed').textContent=fast?'×1 속도':'×2 속도'};
$('skip').onclick=()=>board.skip();
$('end').onclick=()=>{
  if(!me.team.some(Boolean))return toast('캐릭터를 한 명 이상 보드에 놓으세요');
  sel=null;endTurn(me);
  const {frames,r}=battle(me.team,bot.team);
  mode='battle';$('shopbar').hidden=$('info').hidden=true;$('bctl').hidden=false;$('next').hidden=true;$('skip').hidden=false;
  board.play(frames,()=>{
    $('skip').hidden=true;$('next').hidden=false;
    const loss=me.turn<=2?1:me.turn<=4?2:3;
    if(r==='win')me.wins++;else if(r==='lose')me.lives=Math.max(0,me.lives-loss);
    const over=me.wins>=10?'트로피 10개! 우승이에요':me.lives<=0?`게임 오버 · 트로피 ${me.wins}개`:'';
    $('caption').textContent=(r==='win'?'승리! 트로피 +1':r==='lose'?`패배… 체력 -${loss}`:'무승부')+(over?` — ${over}`:'');
    $('next').textContent=over?'새 게임':'다음 턴';
    if(over){stats.games++;stats.best=Math.max(stats.best,me.wins);if(me.wins>=10)stats.champs++}
    $('next').onclick=()=>{mode='shop';$('shopbar').hidden=$('info').hidden=false;$('bctl').hidden=true;over?newGame():nextTurn()};
  },$('caption'));
};
// 프롤로그: 봇 두 팀을 몇 턴 키운 뒤 실제 전투를 계속 돌려 보여 준다.
let demoTimer;

  clearTimeout(demoTimer);
  const a=newState(false),b=newState(false),turns=4+Math.floor(Math.random()*7);
  for(let t=0;t<turns;t++)for(const s of [a,b]){startTurn(s);botPlay(s);endTurn(s)}

function gate(signedIn){

        if(s.exists()){
          const d=s.data();stats={games:d.games||0,champs:d.champs||0,best:d.best||0};
          if(d.run){const r=JSON.parse(d.run);me=r.me;bot=r.bot;foeName=r.foeName;uid=r.uid;sel=null;render();toast('저장된 게임을 불러왔어요')}
        }else save();
      }catch(e){console.error(e);toast('기록을 불러오지 못했어요')}
    }
    showAccount();gate(!!u);
    $('plogin').disabled=false;$('plogin').lastChild.textContent='Google로 시작하기';
  });
}
async function save(){
  if(!fb||!user)return;
  const {F,db}=fb;
  try{await F.setDoc(F.doc(db,'autopets',user.uid),{name:(user.displayName||'').slice(0,40),run:JSON.stringify({me,bot,foeName,uid}),...stats,at:F.serverTimestamp()})}
  catch(e){console.error(e);toast('저장하지 못했어요')}
}
async function login(){
  if(!fb)return toast('Firebase 연결 준비 중이에요');
  try{await fb.A.signInWithPopup(fb.auth,new fb.A.GoogleAuthProvider())}
  catch(e){if(e.code!=='auth/popup-closed-by-user')toast('로그인하지 못했어요')}
}
$('plogin').onclick=login;
$('login').onclick=async()=>{
  if(!user)return login();
  await fb.A.signOut(fb.auth);stats={games:0,champs:0,best:0};newGame();
};
newGame();showAccount();gate(false);
initFirebase().catch(e=>{console.error(e);$('plogin').lastChild.textContent='연결 실패 · 새로고침해 주세요'});
</script>
</body>
</html>
